<style>
*{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
body{margin:0;background:#f5f7f9;color:#222}
.container{width:94%;max-width:950px;margin:auto;padding:20px 0 40px}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card,.card,.balance-box,.header{background:#fff;border-radius:18px;box-shadow:0 3px 15px rgba(0,0,0,.06)}
.login-card{width:100%;max-width:420px;padding:28px}
.login-card h1{text-align:center;font-size:22px;margin:0 0 8px}
.login-subtitle{text-align:center;color:#777;font-size:14px;margin-bottom:25px}
.header{position:relative;text-align:center;padding:25px 20px;margin-bottom:18px}
.header h1{margin:0 0 10px;font-size:22px}
.date{color:#666;font-size:14px}
.user-info{color:#666;font-size:13px;margin-top:8px}
.logout-btn{position:absolute;top:14px;left:14px;background:#eee;color:#222;padding:8px 12px;font-size:12px}
.balance-box{padding:22px;margin-bottom:18px;text-align:center}

.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
button{border:0;border-radius:14px;padding:15px;font-size:16px;cursor:pointer}
.receive-btn,.save-receive{background:#168a52;color:#fff}

.card{padding:22px;margin-bottom:18px}

.receipt-sheet{direction:rtl;background:#fff;max-width:700px;margin:auto;border:1px solid #ddd;border-radius:8px;padding:28px;text-align:center}

<script>
"use strict";


/* =========================
   اتصال Supabase
========================= */

const SUPABASE_URL =
"https://pxlvwdwznlklqdofbspv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5J-p7w5eYZTMsSGPYLtd9g_QiitckBc";

const TABLE_NAME = "transaction";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let currentUser = null;
let currentProfile = null;
let transactions = [];

let receiveReceiptNumber = 1;
let withdrawReceiptNumber = 1;


/* =========================
   پیام خطا
========================= */

function showError(message){

const box =
document.getElementById("errorBox");

box.style.display = "block";
box.innerText = message;

}

function hideError(){

document.getElementById("errorBox")
.style.display = "none";

}

function showLoginError(message){

const box =
document.getElementById("loginError");

box.style.display = "block";
box.innerText = message;

}


/* =========================
   ورود
========================= */

async function login(){

const email =
document.getElementById("loginEmail")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;

if(!email){
showLoginError("لطفاً ایمیل را وارد کنید.");
return;
}

if(!password){
showLoginError("لطفاً رمز عبور را وارد کنید.");
return;
}

try{

const result =
await supabaseClient.auth
.signInWithPassword({
email:email,
password:password
});

if(result.error)
throw result.error;

currentUser =
result.data.user;

await loadProfile();

}catch(error){

showLoginError(
"ورود انجام نشد: " + error.message
);

}

}


/* =========================
   پروفایل
========================= */

async function loadProfile(){

if(!currentUser)return;

const result =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.single();

if(result.error){

await supabaseClient.auth.signOut();

currentUser=null;

showLoginError(
"برای این حساب پروفایل ثبت نشده است."
);

return;

}

currentProfile=result.data;

enterApp();

}


/* =========================
   ورود به برنامه
========================= */

async function enterApp(){

document.getElementById("loginPage")
.style.display="none";

document.getElementById("appContainer")
.style.display="block";

document.getElementById("userInfo")
.innerText =
"کاربر: " +
(currentProfile.full_name || "کاربر") +
" | نقش: " +
(currentProfile.role || "cashier");

updateTodayDate();

await loadTransactions();

prepareNewTransaction("receive");
prepareNewTransaction("withdraw");

}


/* =========================
   خروج
========================= */

async function logout(){

await supabaseClient.auth.signOut();

currentUser=null;
currentProfile=null;
transactions=[];

document.getElementById("appContainer")
.style.display="none";

document.getElementById("loginPage")
.style.display="flex";

document.getElementById("loginEmail").value="";
document.getElementById("loginPassword").value="";

}


/* =========================
   سشن قبلی
========================= */

async function checkExistingSession(){

const result =
await supabaseClient.auth.getSession();

if(
result.error ||
!result.data.session
)return;

currentUser =
result.data.session.user;

await loadProfile();

}


/* =========================
   تاریخ و ساعت
========================= */

const pad2 =
n => String(n).padStart(2,"0");


function getTime(){

const now=new Date();

return (
pad2(now.getHours()) +
":" +
pad2(now.getMinutes())
);

}


function gregorianToJalali(
gy,gm,gd
){

const gdm=[
0,31,59,90,120,151,
181,212,243,273,304,334
];

const gy2 =
gm>2 ? gy+1 : gy;

let days =
355666+
365*gy+
Math.floor((gy2+3)/4)-
Math.floor((gy2+99)/100)+
Math.floor((gy2+399)/400)+
gd+
gdm[gm-1];

let jy =
-1595+
33*Math.floor(days/12053);

days%=12053;

jy+=
4*Math.floor(days/1461);

days%=1461;

if(days>365){

jy+=Math.floor((days-1)/365);

days=(days-1)%365;

}

const jm =
days<186
? 1+Math.floor(days/31)
: 7+Math.floor((days-186)/30);

const jd =
1+
(
days<186
? days%31
: (days-186)%30
);

return [jy,jm,jd];

}


function dateInfo(dateObject=new Date()){

const gy=dateObject.getFullYear();
const gm=dateObject.getMonth()+1;
const gd=dateObject.getDate();

const j =
gregorianToJalali(
gy,gm,gd
);

const gregorian =
gy+"/"+pad2(gm)+"/"+pad2(gd);

const jalali =
j[0]+"/"+pad2(j[1])+"/"+pad2(j[2]);

return {

gregorian:gregorian,

jalali:jalali,

combined:
jalali+" | "+gregorian,

key:
gy+"-"+pad2(gm)+"-"+pad2(gd)

};

}


function updateTodayDate(){

document.getElementById("todayDate")
.innerText =
"امروز: "+dateInfo().combined;

}


/* =========================
   مبلغ
========================= */

function formatAmount(number){

return Number(number||0)
.toLocaleString("en-US");

}


function formatMoneyInput(input){

const value =
input.value.replace(/\D/g,"");

input.value =
value
? Number(value).toLocaleString("en-US")
: "";

}


/* =========================
   امنیت نمایش متن
========================= */

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   تبدیل تاریخ دیتابیس
========================= */

function normalizeDateKey(value){

if(!value)return "";

const text=String(value);

const parts=text.split("|");

const gregorian=
(parts.length>1?parts[1]:parts[0]).trim();

const match=
gregorian.match(
/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/
);

if(!match)return "";

return (
match[1]+"-"+
pad2(match[2])+"-"+
pad2(match[3])
);

}


/* =========================
   خواندن تراکنش‌ها
========================= */

async function loadTransactions(){

hideError();

try{

const result =
await supabaseClient
.from(TABLE_NAME)
.select("*")
.order("id",{ascending:false});

if(result.error)
throw result.error;

transactions =
(result.data||[]).map(t=>({

...t,

amount:
Number(t.amount)||0,

description:
t.dascription||"",

person:
t.customer_name||"",

dateKey:
normalizeDateKey(t.date)

}));

updateReceiptNumbers();
updateBalance();
updateTodaySummary();

renderTransactions("receive");
renderTransactions("withdraw");
renderAllHistory();

}catch(error){

showError(
"خطا در خواندن اطلاعات از Supabase: "+
error.message
);

}

}


/* =========================
   شماره رسید
========================= */

function updateReceiptNumbers(){

let receiveMax=0;
let withdrawMax=0;

transactions.forEach(t=>{

const receipt=
String(t.receipt||"");

let match=
receipt.match(/^TPH-D(\d+)$/);

if(match){

receiveMax=
Math.max(
receiveMax,
Number(match[1])
);

}

match=
receipt.match(/^TPH-B(\d+)$/);

if(match){

withdrawMax=
Math.max(
withdrawMax,
Number(match[1])
);

}

});

receiveReceiptNumber=
receiveMax+1;

withdrawReceiptNumber=
withdrawMax+1;

}


function nextReceiptNumber(type){

if(type==="receive")
return receiveReceiptNumber;

return withdrawReceiptNumber;

}


/* =========================
   صفحات
========================= */

function hideAllPages(){

document
.querySelectorAll(".page")
.forEach(page=>{
page.classList.remove("active");
});

}


function goHome(){

hideAllPages();

document
.getElementById("homePage")
.classList.add("active");

updateTodayDate();
updateBalance();
updateTodaySummary();

}


function openTransactionPage(type){

hideAllPages();

document
.getElementById(
type==="receive"
?"receivePage"
:"withdrawPage"
)
.classList.add("active");

prepareNewTransaction(type);

showTab(type,"new");

}


function openAllHistory(){

hideAllPages();

document
.getElementById("allHistoryPage")
.classList.add("active");

renderAllHistory();

}


/* =========================
   تب‌ها
========================= */

function showTab(type,tab){

document.getElementById(type+"New")
.style.display =
tab==="new"?"block":"none";

document.getElementById(type+"History")
.style.display =
tab==="history"?"block":"none";

document.getElementById(type+"NewTab")
.classList.toggle(
"active",
tab==="new"
);

document.getElementById(type+"HistoryTab")
.classList.toggle(
"active",
tab==="history"
);

}


/* =========================
   آماده‌سازی فرم
========================= */

function prepareNewTransaction(type){

const d=dateInfo();
const time=getTime();

const name =
currentProfile?.full_name || "";

const number =
nextReceiptNumber(type);

if(type==="receive"){

document.getElementById("receiveReceipt")
.value="TPH-D"+number;

document.getElementById("receiveDate")
.value=d.combined;

document.getElementById("receiveTime")
.value=time;

document.getElementById("receiveRegisteredBy")
.value=name;

}else{

document.getElementById("withdrawReceipt")
.value="TPH-B"+number;

document.getElementById("withdrawDate")
.value=d.combined;

document.getElementById("withdrawTime")
.value=time;

document.getElementById("withdrawRegisteredBy")
.value=name;

}

}


/* =========================
   ثبت تراکنش
========================= */

async function saveTransaction(type){

hideError();

if(!currentUser){

alert("ابتدا وارد حساب خود شوید.");

return;

}

const person =
document.getElementById(type+"Person")
.value.trim();

const amountText =
document.getElementById(type+"Amount")
.value
.replace(/,/g,"")
.trim();

const amount =
Number(amountText);

const description =
document.getElementById(type+"Description")
.value.trim();

if(!person){

alert("لطفاً نام شخص را وارد کنید.");

return;

}

if(!amount || amount<=0){

alert("لطفاً مبلغ معتبر وارد کنید.");

return;

}

if(!description){

alert("لطفاً توضیحات را وارد کنید.");

return;

}


/* جلوگیری از ثبت برداشت بیشتر از موجودی */

if(
type==="withdraw" &&
amount>getCurrentBalance()
){

alert(
"مبلغ برداشت بیشتر از موجودی فعلی است."
);

return;

}


/* گرفتن شماره جدید */

const number =
nextReceiptNumber(type);

const receipt =
type==="receive"
?"TPH-D"+number
:"TPH-B"+number;

const now=new Date();

const d=dateInfo(now);
const time=getTime();

const row={

type:type,

currency:"AFN",

amount:amount,

dascription:description,

customer_name:person,

rate:1,

receipt:receipt,

date:d.combined,

time:time,

registered_by:
currentProfile.full_name,

created_at:
now.toISOString()

};


try{

const result =
await supabaseClient
.from(TABLE_NAME)
.insert(row)
.select("*")
.single();

if(result.error)
throw result.error;


/* اضافه کردن رکورد جدید */

const saved={
...result.data,

amount:
Number(result.data.amount)||0,

description:
result.data.dascription||"",

person:
result.data.customer_name||"",

dateKey:
normalizeDateKey(result.data.date)

};

transactions.unshift(saved);


/* افزایش شماره فقط بعد از ثبت موفق */

if(type==="receive")
receiveReceiptNumber++;
else
withdrawReceiptNumber++;


/* پاک کردن فرم */

clearForm(type);


/* به‌روزرسانی همه چیز */

updateBalance();
updateTodaySummary();

renderTransactions("receive");
renderTransactions("withdraw");
renderAllHistory();


/* چاپ رسید */

showReceipt(saved);

}catch(error){

showError(
"ثبت تراکنش انجام نشد: "+
error.message
);

}

}


/* =========================
   پاک کردن فرم
========================= */

function clearForm(type){

document.getElementById(type+"Person")
.value="";

document.getElementById(type+"Amount")
.value="";

document.getElementById(type+"Description")
.value="";

prepareNewTransaction(type);

}


/* =========================
   موجودی
========================= */

function getCurrentBalance(){

let balance=0;

transactions.forEach(t=>{

if(t.type==="receive")
balance+=Number(t.amount)||0;

if(t.type==="withdraw")
balance-=Number(t.amount)||0;

});

return balance;

}


function updateBalance(){

document.getElementById("balance")
.innerText =
formatAmount(getCurrentBalance());

}


/* =========================
   جمع امروز
========================= */

function updateTodaySummary(){

const today =
dateInfo().key;

let receive=0;
let withdraw=0;

transactions.forEach(t=>{

if(t.dateKey!==today)
return;

if(t.type==="receive")
receive+=Number(t.amount)||0;

if(t.type==="withdraw")
withdraw+=Number(t.amount)||0;

});

document.getElementById("todayReceive")
.innerText=
formatAmount(receive)+" AFN";

document.getElementById("todayWithdraw")
.innerText=
formatAmount(withdraw)+" AFN";

}


/* =========================
   تاریخچه دریافت / برداشت
========================= */

function renderTransactions(type){

const list =
document.getElementById(type+"List");

const search =
document.getElementById(type+"Search")
.value
.trim()
.toLowerCase();

const filtered =
transactions.filter(t=>{

if(t.type!==type)
return false;

if(!search)
return true;

return (
String(t.receipt||"")
.toLowerCase()
.includes(search)
||
String(t.person||"")
.toLowerCase()
.includes(search)
);

});


if(!filtered.length){

list.innerHTML =
"<div class='empty'>تراکنشی وجود ندارد.</div>";

return;

}


list.innerHTML =
filtered
.map(createTransactionElement)
.join("");

}


function createTransactionElement(t){

const isReceive =

const colorClass =
isReceive

:"withdraw-text";

return `

<div class="transaction">

<div class="transaction-head">

<span>
رسید #${escapeHtml(t.receipt)}
</span>

<span class="${colorClass}">
${isReceive?"دریافت":"برداشت"}
</span>

</div>

<div class="transaction-row">
نام: ${escapeHtml(t.person)}
</div>

<div class="transaction-row">
مبلغ:
<strong>
${formatAmount(t.amount)} AFN
</strong>
</div>

<div class="transaction-row">

</div>

<div class="transaction-row">
ساعت: ${escapeHtml(t.time)}
</div>

<div class="transaction-row">
بابت: ${escapeHtml(t.description)}
</div>

/* =========================
   فیلتر تاریخچه اصلی
========================= */

function filterAll(){

const search =
document.getElementById("allSearch")
.value
.trim()
.toLowerCase();

const from =
document.getElementById("historyFromDate")
.value;

const to =
document.getElementById("historyToDate")
.value;


return transactions.filter(t=>{

const searchMatch =
!search ||
String(t.receipt||"")
.toLowerCase()
.includes(search) ||
String(t.person||"")
.toLowerCase()
.includes(search);


const fromMatch =
!from ||
t.dateKey>=from;

const toMatch =
!to ||
t.dateKey<=to;

return (
searchMatch &&
fromMatch &&
toMatch
);

});

}

/* =========================
   نمایش و چاپ رسید
========================= */

function normalizeDisplayDate(value){

const text=String(value||"");

if(text.includes("|"))
return text;

const match=
text.match(
/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/
);

if(!match)
return text;

const j=
gregorianToJalali(
Number(match[1]),
Number(match[2]),
Number(match[3])
);

return (
j[0]+"/"+
pad2(j[1])+"/"+
pad2(j[2])+
" | "+
match[1]+"/"+
pad2(match[2])+"/"+
pad2(match[3])
);

}

/* =========================

========================= */

function printReceiptById(id){

const transaction =
transactions.find(
t=>Number(t.id)===Number(id)
);

if(!transaction){

alert("رسید پیدا نشد.");

return;

}

showReceipt(transaction);

}
