function todayISO(){

  const d=new Date();

  return(
    d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0")
  );
}

/* =========================================================
   NUMBER
   ========================================================= */

function formatNumber(value){

  return Number(value||0)
    .toLocaleString("en-US",{
      maximumFractionDigits:0
    });
}


function parseAmount(value){

  return Number(
    String(value)
      .replace(/,/g,"")
      .replace(/[^\d]/g,"")
  );
}

/* =========================================================
   DATE DATABASE
   ========================================================= */

function dateToDB(dateValue){

  if(!dateValue)return "";

  const p=dateValue.split("-");

  if(p.length!==3)return dateValue;

  return p[0]+"/"+p[1]+"/"+p[2];
}


function dateToISO(dateValue){

  if(!dateValue)return "";

  const s=
    String(dateValue).substring(0,10);

  if(s.includes("-")){
    return s;
  }

  const p=s.split("/");

  if(p.length===3){

    return(
      p[0]+"-"+
      p[1]+"-"+
      p[2]
    );

  }

  return s;
}


/* =========================================================
   JALALI
   ========================================================= */

function gregorianToJalali(gy,gm,gd){

  const gdm=[
    0,31,59,90,120,151,
    181,212,243,273,304,334
  ];

  let jy;

  if(gy>1600){

    jy=979;
    gy-=1600;

  }else{

    jy=0;
    gy-=621;

  }

  const gy2=
    gm>2 ? gy+1 : gy;

  let days=
    365*gy+
    Math.floor((gy2+3)/4)-
    Math.floor((gy2+99)/100)+
    Math.floor((gy2+399)/400)-
    80+
    gd+
    gdm[gm-1];

  jy+=
    33*Math.floor(days/12053);

  days%=12053;

  jy+=
    4*Math.floor(days/1461);

  days%=1461;

  if(days>365){

    jy+=
      Math.floor((days-1)/365);

    days=
      (days-1)%365;

  }

  let jm;

  if(days<186){

    jm=
      1+
      Math.floor(days/31);

  }else{

    jm=
      7+
      Math.floor((days-186)/30);

  }

  const jd=
    1+
    (
      days<186
        ? days%31
        : (days-186)%30
    );

  return[jy,jm,jd];
}


function jalaliFromISO(iso){

  const p=
    dateToISO(iso).split("-");

  if(p.length!==3){
    return "-";
  }

  const gy=Number(p[0]);
  const gm=Number(p[1]);
  const gd=Number(p[2]);

  if(!gy||!gm||!gd){
    return "-";
  }

  const j=
    gregorianToJalali(
      gy,
      gm,
      gd
    );

  return(
    j[0]+"/"+
    String(j[1]).padStart(2,"0")+"/"+
    String(j[2]).padStart(2,"0")
  );
}


function gregorianDisplay(iso){

  const p=
    dateToISO(iso).split("-");

  if(p.length!==3){
    return "-";
  }

  return(
    p[0]+"/"+
    p[1]+"/"+
    p[2]
  );
}


/* =========================================================
   HOME DATE
   ========================================================= */

function homeDate(){

  const iso=todayISO();

  const shamsi=
    jalaliFromISO(iso);

  const miladi=
    gregorianDisplay(iso);

  return(
    shamsi+
    " | "+
    miladi
  );
}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHTML(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

  }

  button.disabled=true;
  button.textContent="در حال ورود...";

  try{

    const result=

    button.disabled=false;
    button.textContent="ورود";

  }

}

   ========================================================= */

async function loadProfile(){

   ========================================================= */

async function loadTransactions(){

  const result=
    await supabaseClient
      .from("transaction")
      .select("*")
      .order("created_at",{
        ascending:false
      });

  if(result.error){
    throw result.error;
  }

  transactions=
    result.data||[];

  updateDashboard();
}


/* =========================================================
   DASHBOARD
   ========================================================= */

function updateDashboard(){

  let balance=0;
  let receive=0;
  let withdraw=0;

  const today=
    todayISO();

  transactions.forEach(t=>{

    const amount=
      Number(t.amount||0);

    if(t.type==="receive"){

      balance+=amount;

      if(dateToISO(t.date)===today){
        receive+=amount;
      }

    }

    if(t.type==="withdraw"){

      balance-=amount;

      if(dateToISO(t.date)===today){
        withdraw+=amount;
      }

    }

  });

  document
    .getElementById("balance")
    .textContent=
      formatNumber(balance);

  document
    .getElementById("todayReceive")
    .textContent=
      formatNumber(receive)+" AFN";

  document
    .getElementById("todayWithdraw")
    .textContent=
      formatNumber(withdraw)+" AFN";

  document
    .getElementById("currentDate")
    .textContent=
      homeDate();
}


/* =========================================================
   RECEIPT NUMBER
   ========================================================= */

function getNextReceiptNumber(type){

  const prefix=
    type==="receive"
      ? "TPH-D"
      : "TPH-B";

  let max=0;

  transactions.forEach(t=>{

    if(t.type!==type)return;

    const receipt=
      String(t.receipt||"").trim();

    const regex=
      new RegExp(
        "^"+
        prefix.replace("-","\\-")+
        "(\\d+)$",
        "i"
      );

    const match=
      receipt.match(regex);

    if(match){

      max=
        Math.max(
          max,
          Number(match[1])
        );

    }

  });

  return prefix+(max+1);
}

/* =========================================================
   SAVE TRANSACTION
   ========================================================= */

async function saveTransaction(event){

  event.preventDefault();

  const type=
    document
      .getElementById("transactionType")
      .value;

  const customerName=
    document
      .getElementById("customerName")
      .value.trim();

  const amount=
    parseAmount(
      document
        .getElementById("amount")
        .value
    );

  const description=
    document
      .getElementById("description")
      .value.trim();

  const dateInput=
    document
      .getElementById("transactionDate")
      .value;

  const time=
    document
      .getElementById("transactionTime")
      .value;

  const registeredBy=
    document
      .getElementById("registeredBy")
      .value.trim();

  if(!customerName){

    alert(
      "نام شخص را وارد کنید."
    );

    return;
  }

  if(!amount||amount<=0){

    alert(
      "مبلغ معتبر وارد کنید."
    );

    return;
  }

  if(!description){

    alert(
      "توضیحات را وارد کنید."
    );

    return;
  }

  const receipt=
    getNextReceiptNumber(type);

  const save=
    document.getElementById(
      "saveButton"
    );

  save.disabled=true;
  save.textContent="در حال ثبت...";

  try{

    const data={

      type:type,

      currency:"AFN",

      amount:amount,

      dascription:description,

      customer_name:customerName,

      rate:null,

      receipt:receipt,

      date:dateToDB(dateInput),

      time:time,

      registered_by:registeredBy

    };

    const result=
      await supabaseClient
        .from("transaction")
        .insert([data])
        .select()
        .single();

    if(result.error){
      throw result.error;
    }

    await loadTransactions();

    alert(
      type==="receive"
        ? "دریافت با موفقیت ثبت شد."
        : "برداشت با موفقیت ثبت شد."
    );

    showReceipt(result.data);

    document
      .getElementById("transactionForm")
      .reset();

    document
      .getElementById("transactionType")
      .value=
        currentTransactionType;

    document
      .getElementById("receipt")
      .value=
        getNextReceiptNumber(
          currentTransactionType
        );

    document
      .getElementById("transactionDate")
      .value=
        todayISO();

    document
      .getElementById("transactionTime")
      .value=
        currentTime();

    document
      .getElementById("registeredBy")
      .value=
        currentProfile?.full_name||
        currentProfile?.name||
        currentUser?.email||
        "";

  }catch(error){

    console.error(error);

    alert(
      error.message||
      "ثبت انجام نشد."
    );

  }finally{

    save.disabled=false;

    save.textContent=
      type==="receive"
        ? "ثبت دریافت"
        : "ثبت برداشت";

  }

}

/* =========================================================
   FILTER
   ========================================================= */

function getFilteredHistory(){

  const search=
    document
      .getElementById("historySearch")
      .value
      .trim()
      .toLowerCase();

  const from=
    document
      .getElementById("historyFrom")
      .value;

  const to=
    document
      .getElementById("historyTo")
      .value;

  return transactions.filter(t=>{

    const receipt=
      String(t.receipt||"")
        .toLowerCase();

    const name=
      String(t.customer_name||"")
        .toLowerCase();

    const date=
      dateToISO(t.date);

    return(
      (!search||
        receipt.includes(search)||
        name.includes(search)
      )&&
      (!from||date>=from)&&
      (!to||date<=to)
    );

  });
}
