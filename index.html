/* SUPABASE */

const SUPABASE_URL =

const supabaseClient =

  SUPABASE_KEY
);

/* GLOBAL */

let currentUser=null;
let currentProfile=null;

/* DATE */

function todayISO(){

  const d=new Date();

  return (
    d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0")
  );
}

/* TIME */

function currentTime(){

  const d=new Date();

  return (
    String(d.getHours()).padStart(2,"0")+":"+
    String(d.getMinutes()).padStart(2,"0")
  );
}

/* NUMBER */

function formatNumber(value){

  return Number(value||0)
    .toLocaleString("en-US",{
      maximumFractionDigits:0
    });
}

function parseAmount(value){

  return Number(
    String(value)
      .replace(/,/g,"")
      .replace(/[^\d]/g,"")
  );
}

function formatAmountInput(){

  const input=
    document.getElementById("amount");

  if(!input)return;

  const raw=
    input.value.replace(/[^\d]/g,"");

  if(!raw){

    input.value="";
    return;
  }

  input.value=
    Number(raw).toLocaleString("en-US");
}

/* DATE DATABASE */

function dateToDB(dateValue){

  if(!dateValue)return "";

  const p=dateValue.split("-");

  if(p.length!==3)return dateValue;

  return p[0]+"/"+p[1]+"/"+p[2];
}

function dateToISO(dateValue){

  if(!dateValue)return "";

  const s=
    String(dateValue).substring(0,10);

  if(s.includes("-")){
    return s;
  }

  const p=s.split("/");

  if(p.length===3){

    return p[0]+"-"+p[1]+"-"+p[2];

  }

  return s;
}

/* JALALI */

function gregorianToJalali(gy,gm,gd){

  const gdm=[
    0,31,59,90,120,151,
    181,212,243,273,304,334
  ];

  let jy;

  if(gy>1600){

    jy=979;
    gy-=1600;

  }else{

    jy=0;
    gy-=621;
  }

  const gy2=
    gm>2 ? gy+1 : gy;

  let days=
    365*gy+
    Math.floor((gy2+3)/4)-
    Math.floor((gy2+99)/100)+
    Math.floor((gy2+399)/400)-
    80+
    gd+
    gdm[gm-1];

  jy+=
    33*Math.floor(days/12053);

  days%=12053;

  jy+=
    4*Math.floor(days/1461);

  days%=1461;

  if(days>365){

    jy+=
      Math.floor((days-1)/365);

    days=
      (days-1)%365;
  }

  let jm;

  if(days<186){

    jm=
      1+
      Math.floor(days/31);

  }else{

    jm=
      7+
      Math.floor((days-186)/30);
  }

  const jd=
    1+
    (
      days<186
        ? days%31
        : (days-186)%30
    );

  return[jy,jm,jd];
}

function jalaliFromISO(iso){

  const p=
    dateToISO(iso).split("-");

  if(p.length!==3){
    return "-";
  }

  const gy=Number(p[0]);
  const gm=Number(p[1]);
  const gd=Number(p[2]);

  if(!gy||!gm||!gd){
    return "-";
  }

  const j=
    gregorianToJalali(
      gy,gm,gd
    );

  return(
    j[0]+"/"+
    String(j[1]).padStart(2,"0")+"/"+
    String(j[2]).padStart(2,"0")
  );
}

function gregorianDisplay(iso){

  const p=
    dateToISO(iso).split("-");

  if(p.length!==3){
    return "-";
  }

  return p[0]+"/"+p[1]+"/"+p[2];
}

/* BOTH DATES FOR HOME */

function homeDate(){

  const iso=todayISO();

  const shamsi=
    jalaliFromISO(iso);

  const miladi=
    gregorianDisplay(iso);

  return(
    shamsi+
    " | "+
    miladi
  );
}

/* ESCAPE */

function escapeHTML(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* PAGE */

function showPage(id){

  document
    .querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  document
    .getElementById(id)
    .classList.add("active");

  const bar=
    document.getElementById(
      "homeUserBar"
    );

    bar.style.display="flex";

  }else{

/* LOGIN */

function showError(message){

  const box=
    document.getElementById(
      "loginError"
    );

  box.textContent=message;
  box.style.display="block";
}

function hideLoginError(){

  document
    .getElementById("loginError")
    .style.display="none";
}

async function login(){

  hideLoginError();

  const email=
    document
      .getElementById("loginEmail")
      .value.trim();

  const password=
    document
      .getElementById("loginPassword")
      .value;

  const button=
    document.getElementById(
      "loginButton"
    );

  if(!email||!password){

    showError(
      "ایمیل و رمز عبور را وارد کنید."
    );

    return;
  }

  button.disabled=true;
  button.textContent="در حال ورود...";

  try{

    const result=
      await supabaseClient.auth
        .signInWithPassword({
          email,
          password
        });

    if(result.error){
      throw result.error;
    }

    currentUser=
      result.data.user;

    await loadProfile();

    await enterApp();

  }catch(error){

    console.error(error);

    showError(
      error.message||
      "ورود انجام نشد."
    );

  }finally{

    button.disabled=false;
    button.textContent="ورود";
  }
}

/* PROFILE */

async function loadProfile(){

  const result=
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(result.error){
    throw result.error;
  }

  if(!result.data){

    throw new Error(
      "پروفایل این حساب پیدا نشد."
    );
  }

  currentProfile=
    result.data;
}

/* ENTER */

async function enterApp(){

  document
    .getElementById("loginPage")
    .style.display="none";

  document
    .getElementById("appContainer")
    .style.display="block";

  const fullName=
    currentProfile.full_name||
    currentProfile.name||
    currentUser.email;

  const role=
    currentProfile.role||"";

  document
    .getElementById("userName")
    .textContent=fullName;

  document
    .getElementById("userRole")
    .textContent=

  document
    .getElementById("currentDate")
    .textContent=

  updateDashboard();

}

/* SESSION */

async function checkExistingSession(){

  try{

    const result=
      await supabaseClient.auth
        .getSession();

    if(result.error)return;

    const session=
      result.data.session;

    if(!session)return;

    currentUser=
      session.user;

    await loadProfile();

    await enterApp();

  }catch(error){

    console.error(error);

    await supabaseClient.auth.signOut();

  }
}

/* LOGOUT */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser=null;
  currentProfile=null;
  transactions=[];

  document
    .getElementById("appContainer")
    .style.display="none";

  document
    .getElementById("loginPage")
    .style.display="flex";

    .getElementById("loginPassword")

/* LOAD */

async function loadTransactions(){

  const result=
    await supabaseClient
      .from("transaction")
      .select("*")
      .order("created_at",{
        ascending:false
      });

  if(result.error){
    throw result.error;
  }

  transactions=
    result.data||[];

  updateDashboard();
}

/* DASHBOARD */

function updateDashboard(){

  let balance=0;
  let receive=0;
  let withdraw=0;

  const today=
    todayISO();

  transactions.forEach(t=>{

    const amount=
      Number(t.amount||0);

    if(t.type==="receive"){

      balance+=amount;

      if(dateToISO(t.date)===today){
        receive+=amount;
      }

    }

    if(t.type==="withdraw"){

      balance-=amount;

      if(dateToISO(t.date)===today){
        withdraw+=amount;
      }

    }

  });

  document
    .getElementById("balance")
    .textContent=
      formatNumber(balance);

  document
    .getElementById("todayReceive")
    .textContent=
      formatNumber(receive)+" AFN";

  document
    .getElementById("todayWithdraw")
    .textContent=
      formatNumber(withdraw)+" AFN";

  /* آپدیت تاریخ بالای صفحه */

  document
    .getElementById("currentDate")
    .textContent=
      homeDate();
}

/* RECEIPT NUMBER */

function getNextReceiptNumber(type){

  const prefix=
    type==="receive"
      ? "TPH-D"
      : "TPH-B";

  let max=0;

  transactions.forEach(t=>{

    if(t.type!==type)return;

    const receipt=
      String(t.receipt||"").trim();

    const regex=
      new RegExp(
        "^"+
        prefix.replace("-","\\-")+
        "(\\d+)$",
        "i"
      );

    const match=
      receipt.match(regex);

    if(match){

      max=
        Math.max(
          max,
          Number(match[1])
        );
    }

  });

  return prefix+(max+1);
}

/* SAVE */

async function saveTransaction(event){

  event.preventDefault();

  const type=
    document
      .getElementById("transactionType")
      .value;

  const customerName=
    document
      .getElementById("customerName")
      .value.trim();

  const amount=
    parseAmount(
      document
        .getElementById("amount")
        .value
    );

  const description=
    document
      .getElementById("description")
      .value.trim();

  const dateInput=
    document
      .getElementById("transactionDate")
      .value;

  const time=
    document
      .getElementById("transactionTime")
      .value;

  const registeredBy=
    document
      .getElementById("registeredBy")
      .value.trim();

  if(!customerName){

    alert("نام شخص را وارد کنید.");
    return;
  }

  if(!amount||amount<=0){

    alert("مبلغ معتبر وارد کنید.");
    return;
  }

  if(!description){

    alert("توضیحات را وارد کنید.");
    return;
  }

  const receipt=
    getNextReceiptNumber(type);

  const save=
    document.getElementById(
      "saveButton"
    );

  save.disabled=true;
  save.textContent="در حال ثبت...";

  try{

    const data={

      type:type,

      currency:"AFN",

      amount:amount,

      dascription:description,

      customer_name:customerName,

      rate:null,

      receipt:receipt,

      date:dateToDB(dateInput),

      time:time,

      registered_by:registeredBy

    };

    const result=
      await supabaseClient
        .from("transaction")
        .insert([data])
        .select()
        .single();

    if(result.error){
      throw result.error;
    }

    await loadTransactions();

    alert(
      type==="receive"
        ? "دریافت با موفقیت ثبت شد."
        : "برداشت با موفقیت ثبت شد."
    );

    showReceipt(result.data);

    document
      .getElementById("transactionForm")
      .reset();

    document
      .getElementById("transactionType")
      .value=
        currentTransactionType;

    document
      .getElementById("receipt")
      .value=
        getNextReceiptNumber(
          currentTransactionType
        );

    /* فرم بعد از ثبت دوباره تاریخ و ساعت فعلی را می‌گیرد */

    document
      .getElementById("transactionDate")
      .value=
        todayISO();

    document
      .getElementById("transactionTime")
      .value=
        currentTime();

    document
      .getElementById("registeredBy")
      .value=
        currentProfile?.full_name||
        currentProfile?.name||
        currentUser?.email||
        "";

  }catch(error){

    console.error(error);

    alert(
      error.message||
      "ثبت انجام نشد."
    );

  }finally{

    save.disabled=false;

    save.textContent=
      type==="receive"
        ? "ثبت دریافت"
        : "ثبت برداشت";
  }
}

/* HOME */

function goHome(){

  showPage("homePage");

  updateDashboard();
}

/* HISTORY */

async function openHistory(){

  await loadTransactions();

  document
    .getElementById("historySearch")
    .value="";

  document
    .getElementById("historyFrom")
    .value="";

  document
    .getElementById("historyTo")
    .value="";

/* FILTER */

function getFilteredHistory(){

  const search=
    document
      .getElementById("historySearch")
      .value
      .trim()
      .toLowerCase();

  const from=
    document
      .getElementById("historyFrom")
      .value;

  const to=
    document
      .getElementById("historyTo")
      .value;

  return transactions.filter(t=>{

    const receipt=
      String(t.receipt||"")
        .toLowerCase();

    const name=
      String(t.customer_name||"")
        .toLowerCase();

    const date=
      dateToISO(t.date);

    return(
      (!search||
        receipt.includes(search)||
        name.includes(search)
      )&&
      (!from||date>=from)&&
      (!to||date<=to)
    );

  });
}

/* RENDER HISTORY */

function renderHistory(){

  const body=
    document.getElementById(
      "historyBody"
    );

  const list=
    getFilteredHistory();

  if(!list.length){

    body.innerHTML=`
      <tr>
        <td colspan="9" class="empty">
          تراکنشی پیدا نشد.
        </td>
      </tr>
    `;

    return;
  }

  body.innerHTML=
    list.map(t=>{

      const isReceive=
        t.type==="receive";

      const date=
        dateToISO(t.date);

      const shamsi=
        jalaliFromISO(date);

      return`

        <tr>

          <td>
            ${escapeHTML(
              t.receipt||"-"
            )}
          </td>

          <td>
            ${escapeHTML(
              t.customer_name||"-"
            )}
          </td>

          <td dir="ltr">
            ${escapeHTML(
              t.time||"-"
            )}
          </td>

          <td dir="ltr">
            ${escapeHTML(shamsi)}
          </td>

          <td dir="ltr">
            ${formatNumber(t.amount)}
            AFN
          </td>

          <td class="${
            isReceive
              ? "receive-text"
              : "withdraw-text"
          }">

            ${
              isReceive
                ? "دریافت"
                : "برداشت"
            }

          </td>

          <td>
            ${escapeHTML(
              t.dascription||
              "-"
            )}
          </td>

          <td>
            ${escapeHTML(
              t.registered_by||
              "-"
            )}
          </td>

          <td>

            <button
              class="receipt-btn"
              onclick="printReceiptById('${t.id}')">

              چاپ رسید

            </button>

          </td>

        </tr>

      `;

    }).join("");
}
