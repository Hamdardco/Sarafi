<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سیستم حسابداری شرکت همدرد</title>

<style>
*{
  box-sizing:border-box;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#1f2937;
}

.header{
  background:#111827;
  color:white;
  padding:20px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:23px;
}

.container{
  max-width:900px;
  margin:0 auto;
  padding:18px 15px 40px;
}

.today-date{
  background:white;
  border-radius:14px;
  padding:13px;
  text-align:center;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  color:#4b5563;
  font-size:14px;
}

.balance{
  background:white;
  border-radius:18px;
  padding:25px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  margin-bottom:18px;
}

.balance-title{
  color:#6b7280;
  font-size:15px;
}

.balance-number{
  font-size:34px;
  font-weight:bold;
  margin:10px 0;
}

.currency{
  color:#6b7280;
  font-weight:bold;
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:18px;
}

.summary-box{
  background:white;
  border-radius:15px;
  padding:16px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.summary-title{
  font-size:13px;
  color:#6b7280;
}

.summary-number{
  font-size:20px;
  font-weight:bold;
  margin-top:7px;
}

.green-text{
  color:#16a34a;
}

.red-text{
  color:#dc2626;
}

.main-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

button{
  border:none;
  border-radius:14px;
  padding:16px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.receive{
  background:#16a34a;
  color:white;
}

.withdraw{
  background:#dc2626;
  color:white;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.back-button{
  width:100%;
  background:#e5e7eb;
  color:#111827;
  margin-bottom:15px;
}

.page-title{
  background:white;
  border-radius:18px;
  padding:20px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
  margin-bottom:15px;
}

.page-title h2{
  margin:0;
  font-size:22px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  background:#e5e7eb;
  padding:6px;
  border-radius:14px;
  margin-bottom:15px;
}

.tab{
  background:transparent;
  color:#374151;
  padding:13px;
}

.tab.active{
  background:#111827;
  color:white;
}

.tab-content{
  display:none;
}

.tab-content.active{
  display:block;
}

.form-box{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  margin-bottom:15px;
}

.form-box h3{
  margin-top:0;
}

label{
  display:block;
  font-size:13px;
  color:#4b5563;
  margin-top:12px;
  margin-bottom:5px;
}

input,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:15px;
  background:white;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.system-field{
  background:#f3f4f6;
  color:#374151;
}

.save{
  width:100%;
  background:#111827;
  color:white;
  margin-top:18px;
}

.search-box{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
  margin-bottom:15px;
}

.search-box input{
  margin:0;
}

.transactions-box{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.transaction{
  border-bottom:1px solid #e5e7eb;
  padding:17px 0;
}

.transaction:last-child{
  border-bottom:none;
}

.transaction-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
  flex-wrap:wrap;
}

.receipt-number{
  font-weight:bold;
  color:#374151;
}

.amount{
  font-weight:bold;
}

.transaction-line{
  line-height:1.9;
  font-size:14px;
}

.transaction-date{
  color:#6b7280;
  font-size:12px;
  margin-top:5px;
}

.print-button{
  background:#374151;
  color:white;
  padding:9px 14px;
  font-size:13px;
  margin-top:10px;
}

.empty{
  text-align:center;
  color:#9ca3af;
  padding:30px 10px;
}

.home-history-button{
  width:100%;
  background:#111827;
  color:white;
  margin-top:15px;
}

/* تاریخچه خطی */

.history-table-wrapper{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

.history-table{
  min-width:950px;
}

.history-row{
  display:grid;
  grid-template-columns:
    130px
    120px
    80px
    180px
    120px
    90px
    220px
    70px;

  align-items:center;
  border-bottom:1px solid #e5e7eb;
  padding:12px 5px;
  font-size:13px;
  line-height:1.7;
}

.history-row > div{
  padding:0 6px;
}

.history-header{
  font-weight:bold;
  background:#f3f4f6;
  border-radius:8px;
}

/* صفحه رسید */

#printArea{
  display:none;
}

.print-page{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#f3f4f6;
  overflow:auto;
  padding:20px;
}

.print-toolbar{
  max-width:700px;
  margin:0 auto 15px;
  display:flex;
  gap:10px;
}

.print-toolbar button{
  flex:1;
}

.real-print-button{
  background:#111827;
  color:white;
}

.close-print-button{
  background:#e5e7eb;
  color:#111827;
}

.receipt{
  width:100%;
  max-width:700px;
  margin:auto;
  background:white;
  padding:30px;
  color:#000;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.receipt-title{
  text-align:center;
  font-size:24px;
  font-weight:bold;
  margin-bottom:10px;
}

.receipt-type{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin-bottom:25px;
}

.receipt-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  border-bottom:1px solid #ddd;
  padding:12px 0;
}

.receipt-footer{
  margin-top:40px;
  display:flex;
  justify-content:space-between;
  gap:20px;
}

@media(max-width:600px){

  .transaction-head{
    flex-direction:column;
  }

  .receipt-row{
    flex-direction:column;
    gap:5px;
  }

  .receipt-footer{
    flex-direction:column;
  }

  .print-page{
    padding:10px;
  }

  .receipt{
    padding:20px;
  }
}

@media print{

  body{
    background:white !important;
  }

  body > *:not(#printArea){
    display:none !important;
  }

  #printArea{
    display:block !important;
    position:static !important;
    padding:0 !important;
    background:white !important;
  }

  .print-page{
    position:static !important;
    padding:0 !important;
    background:white !important;
  }

  .print-toolbar{
    display:none !important;
  }

  .receipt{
    box-shadow:none !important;
    max-width:none !important;
    width:100% !important;
    padding:15px !important;
  }
}
</style>
</head>

<body>

<!-- صفحه اصلی -->

<div id="homePage" class="page active">

  <div class="header">
    <h1>سیستم حسابداری شرکت همدرد</h1>
  </div>

  <div class="container">

    <div class="today-date">
      امروز: <strong id="todayDate"></strong>
    </div>

    <div class="balance">

      <div class="balance-title">
        موجودی فعلی
      </div>

      <div class="balance-number" id="balance">
        0
      </div>

      <div class="currency">
        AFN
      </div>

    </div>

    <div class="summary">

      <div class="summary-box">

        <div class="summary-title">
          مجموع دریافت امروز
        </div>

        <div
          class="summary-number green-text"
          id="todayReceive">
          0 AFN
        </div>

      </div>

      <div class="summary-box">

        <div class="summary-title">
          مجموع برداشت امروز
        </div>

        <div
          class="summary-number red-text"
          id="todayWithdraw">
          0 AFN
        </div>

      </div>

    </div>

    <div class="main-buttons">

      <button
        class="receive"
        onclick="openTransactionPage('receive')">
        ثبت دریافت
      </button>

      <button
        class="withdraw"
        onclick="openTransactionPage('withdraw')">
        ثبت برداشت
      </button>

    </div>

    <button
      class="home-history-button"
      onclick="openAllHistory()">
      تاریخچه تراکنش‌ها
    </button>

  </div>

</div>


<!-- صفحه دریافت -->

<div id="receivePage" class="page">

  <div class="header">
    <h1>ثبت دریافت</h1>
  </div>

  <div class="container">

    <button
      class="back-button"
      onclick="goHome()">
      بازگشت به صفحه اصلی
    </button>

    <div class="page-title">
      <h2>ثبت تراکنش‌ها</h2>
    </div>

    <div class="tabs">

      <button
        class="tab active"
        id="receiveNewTab"
        onclick="showTab('receive','new')">
        تراکنش جدید
      </button>

      <button
        class="tab"
        id="receiveHistoryTab"
        onclick="showTab('receive','history')">
        تراکنش‌ها
      </button>

    </div>

    <div
      id="receiveNew"
      class="tab-content active">

      <div class="form-box">

        <h3>ثبت دریافت جدید</h3>

        <label>شماره رسید</label>

        <input
          id="receiveReceipt"
          class="system-field"
          type="text"
          readonly>

        <label>تاریخ</label>

        <input
          id="receiveDate"
          class="system-field"
          type="text"
          readonly>

        <label>ساعت</label>

        <input
          id="receiveTime"
          class="system-field"
          type="text"
          readonly>

        <label>ثبت توسط</label>

        <input
          id="receiveRegisteredBy"
          class="system-field"
          type="text"
          value="مدیر"
          readonly>

        <label>نام شخص *</label>

        <input
          id="receivePerson"
          type="text"
          placeholder="نام شخص">

        <label>مبلغ *</label>

        <input
          id="receiveAmount"
          type="text"
          inputmode="numeric"
          placeholder="مبلغ به AFN"
          oninput="formatAmountField(this)">

        <label>بابت / توضیحات *</label>

        <textarea
          id="receiveDescription"
          placeholder="توضیحات تراکنش"></textarea>

        <button
          class="save"
          onclick="saveTransaction('receive')">
          ثبت تراکنش
        </button>

      </div>

    </div>

    <div
      id="receiveHistory"
      class="tab-content">

      <div class="search-box">

        <input
          id="receiveSearch"
          type="search"
          placeholder="جستجو با نام شخص یا شماره رسید"
          oninput="renderTransactions('receive')">

      </div>

      <div class="transactions-box">

        <h3>تمام تراکنش‌های دریافت</h3>

        <div id="receiveList"></div>

      </div>

    </div>

  </div>

</div>


<!-- صفحه برداشت -->

<div id="withdrawPage" class="page">

  <div class="header">
    <h1>ثبت برداشت</h1>
  </div>

  <div class="container">

    <button
      class="back-button"
      onclick="goHome()">
      بازگشت به صفحه اصلی
    </button>

    <div class="page-title">
      <h2>ثبت تراکنش‌ها</h2>
    </div>

    <div class="tabs">

      <button
        class="tab active"
        id="withdrawNewTab"
        onclick="showTab('withdraw','new')">
        تراکنش جدید
      </button>

      <button
        class="tab"
        id="withdrawHistoryTab"
        onclick="showTab('withdraw','history')">
        تراکنش‌ها
      </button>

    </div>

    <div
      id="withdrawNew"
      class="tab-content active">

      <div class="form-box">

        <h3>ثبت برداشت جدید</h3>

        <label>شماره رسید</label>

        <input
          id="withdrawReceipt"
          class="system-field"
          type="text"
          readonly>

        <label>تاریخ</label>

        <input
          id="withdrawDate"
          class="system-field"
          type="text"
          readonly>

        <label>ساعت</label>

        <input
          id="withdrawTime"
          class="system-field"
          type="text"
          readonly>

        <label>ثبت توسط</label>

        <input
          id="withdrawRegisteredBy"
          class="system-field"
          type="text"
          value="مدیر"
          readonly>

        <label>نام شخص *</label>

        <input
          id="withdrawPerson"
          type="text"
          placeholder="نام شخص">

        <label>مبلغ *</label>

        <input
          id="withdrawAmount"
          type="text"
          inputmode="numeric"
          placeholder="مبلغ به AFN"
          oninput="formatAmountField(this)">

        <label>بابت / توضیحات *</label>

        <textarea
          id="withdrawDescription"
          placeholder="توضیحات تراکنش"></textarea>

        <button
          class="save"
          onclick="saveTransaction('withdraw')">
          ثبت تراکنش
        </button>

      </div>

    </div>

    <div
      id="withdrawHistory"
      class="tab-content">

      <div class="search-box">

        <input
          id="withdrawSearch"
          type="search"
          placeholder="جستجو با نام شخص یا شماره رسید"
          oninput="renderTransactions('withdraw')">

      </div>

      <div class="transactions-box">

        <h3>تمام تراکنش‌های برداشت</h3>

        <div id="withdrawList"></div>

      </div>

    </div>

  </div>

</div>


<!-- تاریخچه کلی -->

<div id="allHistoryPage" class="page">

  <div class="header">
    <h1>تاریخچه تراکنش‌ها</h1>
  </div>

  <div class="container">

    <button
      class="back-button"
      onclick="goHome()">
      بازگشت به صفحه اصلی
    </button>

    <div class="search-box">

      <input
        id="allSearch"
        type="search"
        placeholder="جستجو با نام شخص یا شماره رسید"
        oninput="renderAllHistory()">

    </div>

    <div class="transactions-box">

      <h3>تمام تراکنش‌ها</h3>

      <div id="allHistoryList"></div>

    </div>

  </div>

</div>


<!-- ناحیه چاپ -->

<div id="printArea"></div>


<script>

  const SUPABASE_URL = "https://pxlvwdwznlklqdofbspv.supabase.co";

const SUPABASE_KEY = "کلید publishable خودت را اینجا بگذار";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const TABLE_NAME = "transaction";

let transactions = [];

async function loadTransactions(){

  const { data, error } =
    await supabaseClient
      .from(TABLE_NAME)
      .select("*")
      .order("id", {
        ascending: false
      });

  if(error){

    console.error(error);

    alert(
      "خطا در اتصال به پایگاه داده: " +
      error.message
    );

    return;

  }

  transactions = data || [];

  console.log(
    "تراکنش‌ها دریافت شد:",
    transactions
  );

}

loadTransactions();
</script>
</body>
</html>
