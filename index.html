/* =====================================================
   تبدیل میلادی به شمسی
===================================================== */

function gregorianToJalali(gy, gm, gd){

  const gdm = [
    0,31,59,90,120,151,
    181,212,243,273,304,334
  ];

  let jy =
    (gy <= 1600)
    ? 0
    : 979;

  gy -=
    (gy <= 1600)
    ? 621
    : 1600;

  const gy2 =
    (gm > 2)
    ? gy + 1
    : gy;

  let days =
    (365 * gy) +
    Math.floor((gy2 + 3) / 4) -
    Math.floor((gy2 + 99) / 100) +
    Math.floor((gy2 + 399) / 400) -
    80 +
    gd +
    gdm[gm - 1];

  jy +=
    33 * Math.floor(days / 12053);

  days %= 12053;

  jy +=
    4 * Math.floor(days / 1461);

  days %= 1461;

  if(days > 365){

    jy +=
      Math.floor((days - 1) / 365);

    days =
      (days - 1) % 365;

  }

  const jm =
    days < 186
    ? 1 + Math.floor(days / 31)
    : 7 + Math.floor((days - 186) / 30);

  const jd =
    1 +
    (
      days < 186
      ? days % 31
      : (days - 186) % 30
    );

  return [jy, jm, jd];

}


/* =====================================================
   تاریخ و ساعت
===================================================== */

function pad2(number){

  return String(number).padStart(2, "0");

}


function getDateInfo(date){

  const gy =
    date.getFullYear();

  const gm =
    date.getMonth() + 1;

  const gd =
    date.getDate();

  const jalali =
    gregorianToJalali(
      gy,
      gm,
      gd
    );

  const jy = jalali[0];
  const jm = jalali[1];
  const jd = jalali[2];

  return {

    gregorian:
      gy + "/" +
      pad2(gm) + "/" +
      pad2(gd),

    jalali:
      jy + "/" +
      pad2(jm) + "/" +
      pad2(jd),

    combined:
      gy + "/" +
      pad2(gm) + "/" +
      pad2(gd) +
      " | " +
      jy + "/" +
      pad2(jm) + "/" +
      pad2(jd),

    key:
      gy + "-" +
      pad2(gm) + "-" +
      pad2(gd)

  };

}


function getTime(date){

  return (
    pad2(date.getHours()) +
    ":" +
    pad2(date.getMinutes())
  );

}


/* =====================================================
   فرمت مبلغ
===================================================== */

function formatAmount(amount){

  const number =
    Number(amount);

  if(!Number.isFinite(number)){

    return "0";

  }

  return number.toLocaleString(
    "en-US",
    {
      maximumFractionDigits: 0
    }
  );

}


function formatAmountField(input){

  let value =
    input.value.replace(
      /[^0-9]/g,
      ""
    );

  if(!value){

    input.value = "";

    return;

  }

  input.value =
    Number(value).toLocaleString(
      "en-US"
    );

}


/* =====================================================
   تاریخ امروز
===================================================== */

function updateTodayDate(){

  const element =
    document.getElementById(
      "todayDate"
    );

  if(!element){

    return;

  }

  element.innerText =
    getDateInfo(
      new Date()

}


/* =====================================================
   دریافت تراکنش‌ها از Supabase
===================================================== */

async function loadTransactions(){

  const { data, error } =
    await supabaseClient
      .from(TABLE_NAME)
      .select("*")
      .order(
        "id",
        {
          ascending: false
        }
      );

  if(error){

    console.error(
      "Supabase error:",
      error
    );

    alert(
      "خطا در اتصال به پایگاه داده:\n\n" +
      error.message
    );

    return;

  }


  transactions =
    (data || []).map(
      function(t){

        let dateKey = "";

        if(t.date){

          dateKey =
            String(t.date)
              .substring(0,10)
              .replace(/\//g,"-");

        }


        return {

          id:
            t.id,

          type:
            t.type,

          person:
            t.customer_name || "",

          amount:
            Number(t.amount) || 0,

          description:
            t.description || "",

          receipt:
            t.receipt || "",

          date:
            t.date || "",

          dateKey:
            dateKey,

          time:
            t.time || "",

          registeredBy:
            t.registered_by || "مدیر"

        };

      }
    );


  updateReceiptNumbers();

  updateBalance();

  updateTodaySummary();

  updateTodayDate();

}


/* =====================================================
   پیدا کردن شماره رسید بعدی
===================================================== */

function updateReceiptNumbers(){

  let receiveMax = 0;
  let withdrawMax = 0;


  transactions.forEach(
    function(t){

      if(!t.receipt){

        return;

      }


      const number =
        parseInt(
          String(t.receipt)
            .replace(/\D/g,"")
        ) || 0;


      if(t.type === "receive"){

        receiveMax =
          Math.max(
            receiveMax,
            number
          );

      }


      if(t.type === "withdraw"){

        withdrawMax =
          Math.max(
            withdrawMax,
            number
          );

      }

    }
  );


  receiveReceiptNumber =
    receiveMax + 1;

  withdrawReceiptNumber =
    withdrawMax + 1;

}

/* =====================================================
   آماده کردن تراکنش جدید
===================================================== */

function prepareNewTransaction(type){

  const now =
    new Date();

  const date =
    getDateInfo(now);

  const time =
    getTime(now);


  if(type === "receive"){

    document.getElementById(
      "receiveReceipt"
    ).value =
      "REC-" +
      String(
        receiveReceiptNumber
      ).padStart(6,"0");


    document.getElementById(
      "receiveDate"
    ).value =
      date.combined;


    document.getElementById(
      "receiveTime"
    ).value =
      time;


  }else{

    document.getElementById(
      "withdrawReceipt"
    ).value =
      "PAY-" +
      String(
        withdrawReceiptNumber
      ).padStart(6,"0");


    document.getElementById(
      "withdrawDate"
    ).value =
      date.combined;


    document.getElementById(
      "withdrawTime"
    ).value =
      time;

  }

}


/* =====================================================
   ثبت تراکنش در Supabase
===================================================== */

async function saveTransaction(type){

  let person;
  let amount;
  let description;


  if(type === "receive"){

    person =
      document
        .getElementById(
          "receivePerson"
        )
        .value
        .trim();


    amount =
      Number(
        document
          .getElementById(
            "receiveAmount"
          )
          .value
          .replace(/,/g,"")
      );


    description =
      document
        .getElementById(
          "receiveDescription"
        )
        .value
        .trim();


  }else{

    person =
      document
        .getElementById(
          "withdrawPerson"
        )
        .value
        .trim();


    amount =
      Number(
        document
          .getElementById(
            "withdrawAmount"
          )
          .value
          .replace(/,/g,"")
      );


    description =
      document
        .getElementById(
          "withdrawDescription"
        )
        .value
        .trim();

  }


  if(!person){

    alert(
      "نام شخص را وارد کنید."
    );

    return;

  }


  if(!amount || amount <= 0){

    alert(
      "مبلغ را وارد کنید."
    );

    return;

  }


  if(!description){

    alert(
      "قسمت «بابت / توضیحات» اجباری است."
    );

    return;

  }


  const now =
    new Date();

  const date =
    getDateInfo(now);

  const time =
    getTime(now);


  const receipt =
    type === "receive"

    ? "REC-" +
      String(
        receiveReceiptNumber
      ).padStart(6,"0")

    : "PAY-" +
      String(
        withdrawReceiptNumber
      ).padStart(6,"0");


  const dbTransaction = {

    type:
      type,

    currency:
      "AFN",

    amount:
      amount,

    description:
      description,

    customer_name:
      person,

    rate:
      1,

    receipt:
      receipt,

    date:
      date.combined,

    time:
      time,

    registered_by:
      "مدیر"

  };


  const { data, error } =
    await supabaseClient
      .from(TABLE_NAME)
      .insert([
        dbTransaction
      ])
      .select()
      .single();


  if(error){

    console.error(
      "Insert error:",
      error
    );

    alert(
      "تراکنش ثبت نشد:\n\n" +
      error.message
    );

    return;

  }


  const transaction = {

    id:
      data.id,

    type:
      data.type,

    person:
      data.customer_name,

    amount:
      Number(data.amount) || 0,

    description:
      data.description || "",

    receipt:
      data.receipt,

    date:
      data.date,

    dateKey:
      date.key,

    time:
      data.time,

    registeredBy:
      data.registered_by || "مدیر"

  };


  transactions.unshift(
    transaction
  );


  if(type === "receive"){

    receiveReceiptNumber++;

  }else{

    withdrawReceiptNumber++;

  }


  updateBalance();

  updateTodaySummary();

  clearForm(type);

  alert(
    "تراکنش با موفقیت ثبت شد."
  );

  showReceipt(
    transaction
  );

}


/* =====================================================
   پاک کردن فرم
===================================================== */

function clearForm(type){

  if(type === "receive"){

    document.getElementById(
      "receivePerson"
    ).value = "";

    document.getElementById(
      "receiveAmount"
    ).value = "";

    document.getElementById(
      "receiveDescription"
    ).value = "";

    prepareNewTransaction(
      "receive"
    );


  }else{

    document.getElementById(
      "withdrawPerson"
    ).value = "";

    document.getElementById(
      "withdrawAmount"
    ).value = "";

    document.getElementById(
      "withdrawDescription"
    ).value = "";

    prepareNewTransaction(
      "withdraw"
    );

  }

}


/* =====================================================
   موجودی
===================================================== */

function updateBalance(){

  let balance = 0;


  transactions.forEach(
    function(t){

      const amount =
        Number(t.amount) || 0;


      if(t.type === "receive"){

        balance += amount;

      }else{

        balance -= amount;

      }

    }
  );


  const element =
    document.getElementById(
      "balance"
    );


  if(element){

    element.innerText =
      formatAmount(
        balance
      );

  }

}


/* =====================================================
   خلاصه امروز
===================================================== */

function updateTodaySummary(){

  let receive = 0;
  let withdraw = 0;


  const today =
    getDateInfo(
      new Date()
    ).key;


  transactions.forEach(
    function(t){

      if(t.dateKey !== today){

        return;

      }


      const amount =
        Number(t.amount) || 0;


      if(t.type === "receive"){

        receive += amount;

      }else{

        withdraw += amount;

      }

    }
  );


  const receiveElement =
    document.getElementById(
      "todayReceive"
    );


  const withdrawElement =
    document.getElementById(
      "todayWithdraw"
    );


  if(receiveElement){

    receiveElement.innerText =
      formatAmount(receive) +
      " AFN";

  }


  if(withdrawElement){

    withdrawElement.innerText =
      formatAmount(withdraw) +
      " AFN";

  }

}


/* =====================================================
   تاریخچه دریافت و برداشت
===================================================== */

function renderTransactions(type){

  const searchInput =
    type === "receive"

    ? document.getElementById(
        "receiveSearch"
      )

    : document.getElementById(
        "withdrawSearch"
      );


  const search =
    searchInput

    ? searchInput.value
        .trim()
        .toLowerCase()

    : "";


  const list =
    type === "receive"

    ? document.getElementById(
        "receiveList"
      )

    : document.getElementById(
        "withdrawList"
      );


  const filtered =
    transactions
      .filter(
        function(t){

          return t.type === type;

        }
      )
      .filter(
        function(t){

          if(!search){

            return true;

          }


          return (

            String(t.person)
              .toLowerCase()
              .includes(search)

            ||

            String(t.receipt)
              .toLowerCase()
              .includes(search)

          );

        }
      );


  if(filtered.length === 0){

    list.innerHTML =
      '<div class="empty">تراکنشی پیدا نشد.</div>';

    return;

  }


  list.innerHTML = "";


  filtered.forEach(
    function(t){

      list.appendChild(
        createTransactionElement(t)
      );

    }
  );

}

/* =====================================================

function createTransactionElement(t){

/* =====================================================
   جلوگیری از HTML
===================================================== */

function escapeHtml(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

/* =====================================================

          String(t.id) ===
          String(id)
        );

    );


  if(transaction){
