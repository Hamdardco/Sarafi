<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>سیستم حسابداری شرکت همدرد</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  margin:0;
  background:#f5f6f7;
  color:#222;
}

button,
input,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* LOGIN */

.login-box{
  max-width:400px;
  margin:80px auto;
  background:#fff;
  padding:30px;
  border-radius:18px;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.login-box h2{
  text-align:center;
  margin-top:0;
}

.login-box input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
}

.login-box button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#222;
  color:#fff;
  margin-top:10px;
}

/* HEADER */

.header{
  background:#fff;
  border-radius:18px;
  padding:18px 20px;
  margin-bottom:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.header h1{
  margin:0;
  font-size:21px;
}

.user-info{
  color:#666;
  font-size:13px;
  text-align:left;
}

/* BALANCE */

.balance-box{
  background:#fff;
  border-radius:18px;
  padding:25px;
  text-align:center;
  margin-bottom:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.balance-title{
  color:#777;
  font-size:14px;
}

.balance{
  font-size:32px;
  font-weight:bold;
  margin-top:8px;
}

/* BUTTONS */

.main-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:18px;
}

.main-buttons button{
  border:0;
  padding:18px;
  border-radius:15px;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

.receive-btn{
  background:#168a52;
}

.withdraw-btn{
  background:#d93636;
}

.history-btn{
  width:100%;
  background:#222;
  color:#fff;
  border:0;
  padding:15px;
  border-radius:14px;
  font-size:15px;
}

/* SUMMARY */

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin:18px 0;
}

.summary-box{
  background:#fff;
  padding:18px;
  border-radius:15px;
  text-align:center;
}

.summary-box small{
  color:#777;
}

.summary-box strong{
  display:block;
  margin-top:7px;
  font-size:19px;
}

/* FORM */

.form-box{
  display:none;
  background:#fff;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.form-box h2{
  margin-top:0;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  font-size:13px;
  color:#555;
}

.form-group input,
.form-group textarea{
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
  background:#fff;
}

.form-group textarea{
  min-height:80px;
  resize:vertical;
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.save-btn{
  flex:1;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#222;
  color:#fff;
}

.cancel-btn{
  padding:13px 20px;
  border:0;
  border-radius:10px;
  background:#eee;
}

/* HISTORY */

.history-box{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-top:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.history-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.history-header h2{
  margin:0;
}

.search{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:12px;
}

.history-list{
  width:100%;
}

/* COMPACT TRANSACTIONS */

.transaction{
  border-bottom:1px solid #e5e5e5;
  padding:12px 4px;
  margin-bottom:0;
  background:#fff;
  display:flex;
  align-items:center;
  gap:16px;
  overflow-x:auto;
  white-space:nowrap;
}

.transaction-head{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
  min-width:125px;
}

.transaction-row{
  color:#555;
  font-size:13px;
  margin:0;
  min-width:max-content;
}

.transaction-amount{
  font-weight:bold;
  min-width:105px;
}

.transaction-type{
  min-width:55px;
  font-weight:bold;
}

.transaction-description{
  min-width:140px;
  max-width:200px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.transaction-print{
  background:#222;
  color:white;
  padding:7px 12px;
  font-size:12px;
  border-radius:8px;
  min-width:75px;
  border:0;
}

.receive-text{
  color:#168a52;
}

.withdraw-text{
  color:#d93636;
}

/* RECEIPT */

.receipt-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.receipt{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:25px;
  border-radius:15px;
}

.receipt h2{
  text-align:center;
  margin-top:0;
}

.receipt-line{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #eee;
  padding:9px 0;
  gap:15px;
}

.receipt-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.receipt-buttons button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:10px;
}

.print-btn{
  background:#222;
  color:#fff;
}

.close-btn{
  background:#eee;
}

/* MOBILE */

@media(max-width:700px){

  .container{
    padding:12px;
  }

  .header{
    flex-direction:column;
    align-items:flex-start;
  }

  .user-info{
    text-align:right;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .main-buttons{
    grid-template-columns:1fr;
  }

  .summary{
    grid-template-columns:1fr 1fr;
  }

  .transaction{
    gap:12px;
  }

}

</style>

</head>


<body>


<!-- LOGIN -->

<div id="loginPage">

  <div class="login-box">

    <h2>سیستم حسابداری شرکت همدرد</h2>

    <input
      id="loginEmail"
      type="email"
      placeholder="ایمیل"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="رمز عبور"
    >

    <button onclick="login()">
      ورود
    </button>

    <p
      id="loginError"
      style="
        color:#d93636;
        text-align:center;
        font-size:13px;
      "
    ></p>

  </div>

</div>


<!-- APP -->

<div
  id="app"
  style="display:none;"
>

<div class="container">


  <!-- HEADER -->

  <div class="header">

    <div>

      <h1>
        سیستم حسابداری شرکت همدرد
      </h1>

      <div
        id="currentDate"
        style="
          color:#777;
          font-size:13px;
          margin-top:6px;
        "
      ></div>

    </div>

    <div
      class="user-info"
      id="userInfo"
    ></div>

  </div>


  <!-- BALANCE -->

  <div class="balance-box">

    <div class="balance-title">
      موجودی فعلی
    </div>

    <div
      class="balance"
      id="balance"
    >
      0 AFN
    </div>

  </div>


  <!-- BUTTONS -->

  <div class="main-buttons">

    <button
      class="receive-btn"
      onclick="prepareNewTransaction('receive')"
    >
      ثبت دریافت
    </button>

    <button
      class="withdraw-btn"
      onclick="prepareNewTransaction('withdraw')"
    >
      ثبت برداشت
    </button>

  </div>


  <!-- SUMMARY -->

  <div class="summary">

    <div class="summary-box">

      <small>
        دریافت امروز
      </small>

      <strong
        id="todayReceive"
        class="receive-text"
      >
        0 AFN
      </strong>

    </div>


    <div class="summary-box">

      <small>
        برداشت امروز
      </small>

      <strong
        id="todayWithdraw"
        class="withdraw-text"
      >
        0 AFN
      </strong>

    </div>

  </div>


  <!-- FORM -->

  <div
    id="transactionForm"
    class="form-box"
  >

    <h2 id="formTitle">
      ثبت تراکنش
    </h2>

    <div class="form-grid">


      <div class="form-group">

        <label>
          شماره رسید
        </label>

        <input
          id="receiveReceipt"
          type="text"
          readonly
          style="display:none;"
        >

        <input
          id="withdrawReceipt"
          type="text"
          readonly
          style="display:none;"
        >

      </div>


      <div class="form-group">

        <label>
          نام
        </label>

        <input
          id="person"
          type="text"
          placeholder="نام شخص"
        >

      </div>


      <div class="form-group">

        <label>
          مبلغ (AFN)
        </label>

        <input
          id="amount"
          type="number"
          min="0"
          placeholder="مثلاً 25000"
        >

      </div>


      <div class="form-group">

        <label>
          تاریخ
        </label>

        <input
          id="date"
          type="date"
        >

      </div>


      <div class="form-group">

        <label>
          ساعت
        </label>

        <input
          id="time"
          type="time"
        >

      </div>


      <div class="form-group full">

        <label>
          بابت
        </label>

        <textarea
          id="description"
          placeholder="توضیحات / بابت"
        ></textarea>

      </div>


    </div>


    <div class="form-actions">

      <button
        class="save-btn"
        onclick="saveTransaction()"
      >
        ثبت نهایی
      </button>

      <button
        class="cancel-btn"
        onclick="cancelTransaction()"
      >
        لغو
      </button>

    </div>

  </div>


  <!-- HISTORY -->

  <div class="history-box">

    <div class="history-header">

      <h2>
        تاریخچه تراکنش‌ها
      </h2>

    </div>


    <input
      id="searchInput"
      class="search"
      type="text"
      placeholder="جستجو با شماره رسید یا نام..."
      oninput="renderAllHistory()"
    >


    <div
      id="historyList"
      class="history-list"
    ></div>

  </div>


</div>

</div>


<!-- RECEIPT -->

<div
  id="receiptOverlay"
  class="receipt-overlay"
>

  <div class="receipt">

    <h2>
      رسید شرکت همدرد
    </h2>

    <div id="receiptContent"></div>

    <div class="receipt-buttons">

      <button
        class="print-btn"
        onclick="printReceipt()"
      >
        چاپ رسید
      </button>

      <button
        class="close-btn"
        onclick="closeReceipt()"
      >
        بستن
      </button>

    </div>

  </div>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://pxlvwdwznlklqdofbspv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_5J-p7w5eYZTMsSGPYLtd9g_QiitckBc";

const TABLE_NAME =
  "transaction";


let supabaseClient = null;

let currentUser = null;

let currentProfile = null;

let transactions = [];

let receiveReceiptNumber = 1;

let withdrawReceiptNumber = 1;

let currentTransactionType = null;

let currentReceiptData = null;


/* =========================
   START
========================= */

window.addEventListener(
  "DOMContentLoaded",
  async function(){

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    await checkSession();

  }
);


/* =========================
   SESSION
========================= */

async function checkSession(){

  const result =
    await supabaseClient.auth.getSession();

  if(
    result.data &&
    result.data.session
  ){

    currentUser =
      result.data.session.user;

    await loadProfile();

  }else{

    showLogin();

  }

}


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const error =
    document
      .getElementById("loginError");


  error.textContent = "";


  if(!email || !password){

    error.textContent =
      "ایمیل و رمز عبور را وارد کنید.";

    return;

  }


  const result =
    await supabaseClient.auth.signInWithPassword({

      email:email,

      password:password

    });


  if(result.error){

    error.textContent =
      result.error.message;

    return;

  }


  currentUser =
    result.data.user;

  await loadProfile();

}


/* =========================
   PROFILE
========================= */

async function loadProfile(){

  const result =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .single();


  if(result.error){

    alert(
      "اطلاعات کاربر پیدا نشد."
    );

    return;

  }


  currentProfile =
    result.data;


  document
    .getElementById("loginPage")
    .style.display = "none";


  document
    .getElementById("app")
    .style.display = "block";


  document
    .getElementById("userInfo")
    .textContent =
      "کاربر: " +
      (currentProfile.full_name || "") +
      " | نقش: " +
      (currentProfile.role || "");


  setCurrentDate();

  await loadTransactions();

}


/* =========================
   DATE
========================= */

function setCurrentDate(){

  const now =
    new Date();

  const date =
    now.toLocaleDateString(
      "fa-IR",
      {
        year:"numeric",
        month:"long",
        day:"numeric"
      }
    );

  document
    .getElementById("currentDate")
    .textContent =
      date;

}


/* =========================
   LOAD TRANSACTIONS
========================= */

async function loadTransactions(){

  const result =
    await supabaseClient
      .from(TABLE_NAME)
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(result.error){

    alert(
      "خطا در دریافت تراکنش‌ها:\n" +
      result.error.message
    );

    return;

  }


  transactions =
    (result.data || []).map(
      function(t){

        return {

          id:t.id,

          type:t.type,

          amount:Number(t.amount) || 0,

          person:
            t.customer_name || "",

          description:
            t.dascription || "",

          receipt:
            t.receipt || "",

          date:
            t.date || "",

          time:
            t.time || "",

          registeredBy:
            t.registered_by || "",

          currency:
            t.currency || "AFN"

        };

      }
    );


  updateReceiptNumbers();

  updateBalance();

  updateTodaySummary();

  renderAllHistory();

}


/* =========================
   RECEIPT NUMBERS
========================= */

function updateReceiptNumbers(){

  let maxReceive = 0;

  let maxWithdraw = 0;


  transactions.forEach(
    function(t){

      const receipt =
        String(
          t.receipt || ""
        ).trim();

      let match;


      if(t.type === "receive"){

        match =
          receipt.match(
            /^TPH_D(\d+)$/
          );

        if(match){

          maxReceive =
            Math.max(
              maxReceive,
              Number(match[1])
            );

        }

      }


      if(t.type === "withdraw"){

        match =
          receipt.match(
            /^TPH_B(\d+)$/
          );

        if(match){

          maxWithdraw =
            Math.max(
              maxWithdraw,
              Number(match[1])
            );

        }

      }

    }
  );


  receiveReceiptNumber =
    maxReceive + 1;

  withdrawReceiptNumber =
    maxWithdraw + 1;

}


/* =========================
   PREPARE FORM
========================= */

function prepareNewTransaction(type){

  currentTransactionType =
    type;


  const form =
    document
      .getElementById(
        "transactionForm"
      );

  const title =
    document
      .getElementById(
        "formTitle"
      );


  form.style.display =
    "block";


  if(type === "receive"){

    title.textContent =
      "ثبت دریافت";


    document
      .getElementById(
        "receiveReceipt"
      )
      .style.display =
        "block";


    document
      .getElementById(
        "withdrawReceipt"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "receiveReceipt"
      )
      .value =
        "TPH_D" +
        receiveReceiptNumber;

  }else{

    title.textContent =
      "ثبت برداشت";


    document
      .getElementById(
        "receiveReceipt"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "withdrawReceipt"
      )
      .style.display =
        "block";


    document
      .getElementById(
        "withdrawReceipt"
      )
      .value =
        "TPH_B" +
        withdrawReceiptNumber;

  }


  const now =
    new Date();


  document
    .getElementById("date")
    .value =
      getLocalDate(now);


  document
    .getElementById("time")
    .value =
      getLocalTime(now);


  document
    .getElementById("person")
    .value = "";


  document
    .getElementById("amount")
    .value = "";


  document
    .getElementById("description")
    .value = "";


  form.scrollIntoView({
    behavior:"smooth"
  });

}


/* =========================
   LOCAL DATE
========================= */

function getLocalDate(date){

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");


  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


/* =========================
   LOCAL TIME
========================= */

function getLocalTime(date){

  const hours =
    String(
      date.getHours()
    ).padStart(2,"0");

  const minutes =
    String(
      date.getMinutes()
    ).padStart(2,"0");


  return (
    hours +
    ":" +
    minutes
  );

}


/* =========================
   SAVE TRANSACTION
========================= */

async function saveTransaction(){

  if(!currentTransactionType){

    return;

  }


  const person =
    document
      .getElementById("person")
      .value
      .trim();


  const amount =
    Number(
      document
        .getElementById("amount")
        .value
    );


  const date =
    document
      .getElementById("date")
      .value;


  const time =
    document
      .getElementById("time")
      .value;


  const description =
    document
      .getElementById("description")
      .value
      .trim();


  const receipt =
    currentTransactionType === "receive"

      ? document
          .getElementById(
            "receiveReceipt"
          )
          .value

      : document
          .getElementById(
            "withdrawReceipt"
          )
          .value;


  if(!person){

    alert(
      "نام را وارد کنید."
    );

    return;

  }


  if(!amount || amount <= 0){

    alert(
      "مبلغ معتبر وارد کنید."
    );

    return;

  }


  if(!date){

    alert(
      "تاریخ را وارد کنید."
    );

    return;

  }


  if(!time){

    alert(
      "ساعت را وارد کنید."
    );

    return;

  }


  if(!description){

    alert(
      "قسمت بابت را وارد کنید."
    );

    return;

  }


  const row = {

    type:
      currentTransactionType,

    currency:
      "AFN",

    amount:
      amount,

    dascription:
      description,

    customer_name:
      person,

    rate:
      1,

    receipt:
      String(receipt),

    date:
      date,

    time:
      time,

    registered_by:
      currentProfile.full_name,

    created_at:
      new Date().toISOString()

  };


  const result =
    await supabaseClient
      .from(TABLE_NAME)
      .insert(row)
      .select("*")
      .single();


  if(result.error){

    alert(
      "خطا در ثبت تراکنش:\n" +
      result.error.message
    );

    return;

  }


  const t =
    result.data;


  const newTransaction = {

    id:t.id,

    type:t.type,

    amount:Number(t.amount) || 0,

    person:
      t.customer_name || "",

    description:
      t.dascription || "",

    receipt:
      t.receipt || "",

    date:
      t.date || "",

    time:
      t.time || "",

    registeredBy:
      t.registered_by || "",

    currency:
      t.currency || "AFN"

  };


  transactions.unshift(
    newTransaction
  );


  updateReceiptNumbers();

  updateBalance();

  updateTodaySummary();

  renderAllHistory();

  clearForm();

  currentTransactionType =
    null;


  showReceipt(
    newTransaction
  );

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

  document
    .getElementById(
      "person"
    )
    .value = "";


  document
    .getElementById(
      "amount"
    )
    .value = "";


  document
    .getElementById(
      "description"
    )
    .value = "";


  document
    .getElementById(
      "transactionForm"
    )
    .style.display =
      "none";

}


/* =========================
   CANCEL
========================= */

function cancelTransaction(){

  currentTransactionType =
    null;

  clearForm();

}


/* =========================
   BALANCE
========================= */

function updateBalance(){

  let balance = 0;


  transactions.forEach(
    function(t){

      if(t.type === "receive"){

        balance +=
          Number(t.amount) || 0;

      }


      if(t.type === "withdraw"){

        balance -=
          Number(t.amount) || 0;

      }

    }
  );


  document
    .getElementById("balance")
    .textContent =
      formatAmount(balance) +
      " AFN";

}


/* =========================
   TODAY SUMMARY
========================= */

function updateTodaySummary(){

  const today =
    getLocalDate(
      new Date()
    );


  let receive = 0;

  let withdraw = 0;


  transactions.forEach(
    function(t){

      if(t.date !== today){

        return;

      }


      if(t.type === "receive"){

        receive +=
          Number(t.amount) || 0;

      }


      if(t.type === "withdraw"){

        withdraw +=
          Number(t.amount) || 0;

      }

    }
  );


  document
    .getElementById(
      "todayReceive"
    )
    .textContent =
      formatAmount(receive) +
      " AFN";


  document
    .getElementById(
      "todayWithdraw"
    )
    .textContent =
      formatAmount(withdraw) +
      " AFN";

}


/* =========================
   FORMAT AMOUNT
========================= */

function formatAmount(amount){

  return (
    Number(amount) || 0
  ).toLocaleString(
    "en-US"
  );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   CREATE TRANSACTION
========================= */

function createTransactionElement(t){

  const isReceive =
    t.type === "receive";


  const typeText =
    isReceive
      ? "دریافت"
      : "برداشت";


  const typeClass =
    isReceive
      ? "receive-text"
      : "withdraw-text";


  const uuid =
    String(t.id || "");


  return `

    <div class="transaction">

      <div class="transaction-head">

        <span>
          ${escapeHtml(t.receipt)}
        </span>

      </div>


      <div class="transaction-row">

        ${escapeHtml(t.person)}

      </div>


      <div class="transaction-amount">

        ${formatAmount(t.amount)}
        AFN

      </div>


      <div
        class="transaction-type ${typeClass}"
      >

        ${typeText}

      </div>


      <div class="transaction-row">

        ${escapeHtml(t.date)}

      </div>


      <div class="transaction-row">

        ${escapeHtml(t.time)}

      </div>


      <div class="transaction-description">

        ${escapeHtml(t.description)}

      </div>


      <div class="transaction-row">

        ${escapeHtml(t.registeredBy)}

      </div>


      <button
        class="transaction-print"
        onclick='printReceiptById(${JSON.stringify(uuid)})'
      >
        چاپ رسید
      </button>

    </div>

  `;

}


/* =========================
   HISTORY
========================= */

function renderAllHistory(){

  const container =
    document
      .getElementById(
        "historyList"
      );


  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  let filtered =
    transactions;


  if(search){

    filtered =
      transactions.filter(
        function(t){

          const receipt =
            String(
              t.receipt || ""
            ).toLowerCase();


          const person =
            String(
              t.person || ""
            ).toLowerCase();


          return (
            receipt.includes(search) ||
            person.includes(search)
          );

        }
      );

  }


  if(filtered.length === 0){

    container.innerHTML = `

      <div
        style="
          text-align:center;
          color:#888;
          padding:25px;
        "
      >
        هنوز تراکنشی ثبت نشده است.
      </div>

    `;

    return;

  }


  container.innerHTML =
    filtered
      .map(
        function(t){

          return createTransactionElement(t);

        }
      )
      .join("");

}


/* =========================
   PRINT RECEIPT BY ID
========================= */

function printReceiptById(id){

  const targetId =
    String(id);


  const t =
    transactions.find(
      function(item){

        return (
          String(item.id) ===
          targetId
        );

      }
    );


  if(!t){

    alert(
      "رسید پیدا نشد."
    );

    return;

  }


  showReceipt({

    type:
      t.type,

    receipt:
      t.receipt,

    customer_name:
      t.person,

    amount:
      t.amount,

    date:
      t.date,

    time:
      t.time,

    dascription:
      t.description,

    registered_by:
      t.registeredBy

  });

}
