<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>سیستم حسابداری شرکت همدرد</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{box-sizing:border-box;font-family:Vazirmatn,Tahoma,sans-serif}

body{margin:0;background:#f3f4f2;color:#252820}

button,input,textarea{font:inherit}

button{cursor:pointer}

input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;outline:none}

input:focus,textarea:focus{border-color:#1f2f25}

button:disabled{opacity:.6;cursor:wait}

.hidden{display:none!important}

#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}

.login-box,.card{background:white;border-radius:16px;padding:24px;box-shadow:0 5px 25px #0000000c}

.login-box{width:100%;max-width:420px;text-align:center}

.logo{width:75px;height:75px;border-radius:18px;background:#1f2f25;color:#d8c27a;display:grid;place-items:center;margin:auto;font-size:25px;font-weight:900}

h1{font-size:22px;color:#1f2f25}

h2{font-size:19px}

label{display:block;text-align:right;font-weight:600;margin:13px 0 6px}

.primary,.secondary,.danger{border:0;border-radius:9px;padding:12px 16px;font-weight:700}

.primary{background:#1f2f25;color:white}

.secondary{background:#e9e9e5;color:#333}

.danger{background:#a52b2b;color:white}

.full{width:100%;margin-top:15px}

.error,.message{padding:11px;border-radius:8px;margin-top:12px;font-size:13px;overflow-wrap:anywhere}

.error{background:#ffe8e8;color:#a00000}

.message{background:#e6f5eb;color:#176b36}

#appContainer{display:none}

header{background:#1f2f25;color:white;padding:20px;text-align:center}

header h2{margin:0;color:#d8c27a}

header small{display:block;margin-top:7px}

#userBar{background:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

main{max-width:850px;margin:20px auto;padding:0 14px;display:none}

main.active{display:block}

.balance{background:#1f2f25;color:white;text-align:center;padding:25px;border-radius:15px}

.balance strong{display:block;font-size:30px;margin-top:10px}

.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}

.summary .card{text-align:center}

.summary strong{display:block;font-size:19px;margin-top:8px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}

.actions button{min-height:60px}

.receive{color:#16823d}

.withdraw{color:#b32424}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}

.menu button{padding:18px 8px}

.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}

.page-head h2{margin:0}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.form-grid .wide{grid-column:1/-1}

table{width:100%;border-collapse:collapse;background:white;min-width:650px}

th,td{padding:11px 8px;border-bottom:1px solid #eee;text-align:center;font-size:13px}

th{background:#1f2f25;color:white}

.table-wrap{overflow-x:auto;border-radius:10px}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}

.tools .wide{grid-column:1/-1}

.receipt{max-width:650px;margin:20px auto;background:white;padding:25px;border:1px solid #ddd}

.receipt-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1f2f25;padding-bottom:15px}

.receipt-head h2{color:#1f2f25}

.receipt table{min-width:0;margin-top:15px}

.receipt td:first-child{font-weight:700;color:#666;width:35%}

.receipt .amount{font-size:22px;font-weight:800}

.receipt-foot{display:flex;justify-content:space-between;margin-top:55px;gap:20px}

.receipt-foot div{border-top:1px solid #555;padding-top:10px;text-align:center;width:50%;font-size:13px}

#recoveryBox{margin-top:15px;text-align:right}

@media(max-width:550px){

 .form-grid,.tools{grid-template-columns:1fr}

 .form-grid .wide,.tools .wide{grid-column:auto}

 .summary strong{font-size:16px}

 .balance strong{font-size:25px}

 .receipt{padding:15px}

}

@media print{

 body{background:white}

 body *{visibility:hidden}

 #printArea,#printArea *{visibility:visible}

 #printArea{position:absolute;inset:0;width:100%;padding:10px}

 .receipt{border:0;margin:0 auto;max-width:none}

}

</style>

</head>

<body>

<!-- ورود -->

<section id="loginPage">

<div class="login-box">

<div class="logo">همدرد</div>

<h1>سیستم حسابداری شرکت همدرد</h1>

<p>ورود به سیستم</p>

<form id="loginForm">

<label for="loginEmail">ایمیل</label>

<input id="loginEmail" type="email" autocomplete="username" required>

<label for="loginPassword">رمز عبور</label>

<input id="loginPassword" type="password" autocomplete="current-password" required>

<button id="loginButton" class="primary full">ورود</button>

</form>

<button id="forgotButton" class="secondary full" type="button">فراموشی رمز عبور</button>

<div id="loginError" class="error hidden"></div>

<div id="recoveryBox" class="hidden">

<h3 id="recoveryTitle">بازیابی رمز عبور</h3>

<div id="recoveryEmailBox">

<label>ایمیل حساب</label>

<input id="recoveryEmail" type="email">

<button id="sendRecovery" class="primary full" type="button">ارسال لینک بازیابی</button>

</div>

<div id="newPasswordBox" class="hidden">

<label>رمز جدید</label>

<input id="newPassword" type="password" autocomplete="new-password">

<label>تکرار رمز جدید</label>

<input id="confirmPassword" type="password" autocomplete="new-password">

<button id="savePassword" class="primary full" type="button">ذخیره رمز جدید</button>

</div>

<div id="recoveryMessage"></div>

<button id="backLogin" class="secondary full" type="button">بازگشت به ورود</button>

</div>

</div>

</section>

<!-- برنامه -->

<div id="appContainer">

<header>

<h2>HAMDARD | همدرد</h2>

<small>سیستم حسابداری شرکت همدرد</small>

</header>

<div id="userBar">

<div><strong id="userName">کاربر</strong><span id="userRole"></span></div>

<button class="danger" onclick="logout()">خروج از حساب</button>

</div>

<!-- خانه -->

<main id="homePage" class="active">

<div class="balance">

موجودی کل حساب

<strong><span id="balance">0</span> AFN</strong>

</div>

<div class="summary">

<div class="card">دریافت امروز<strong class="receive" id="todayReceive">0 AFN</strong></div>

<div class="card">برداشت امروز<strong class="withdraw" id="todayWithdraw">0 AFN</strong></div>

</div>

<div class="actions">

<button class="primary" onclick="openTransaction('receive')">ثبت دریافت</button>

<button class="danger" onclick="openTransaction('withdraw')">ثبت برداشت</button>

</div>

<div class="menu">

<button class="secondary" onclick="openList('receive')">فهرست دریافت‌ها</button>

<button class="secondary" onclick="openList('withdraw')">فهرست برداشت‌ها</button>

<button class="secondary" onclick="openHistory()">تاریخچه تراکنش‌ها</button>

</div>

</main>

<!-- فرم تراکنش -->

<main id="transactionPage">

<div class="page-head">

<h2 id="formTitle">ثبت تراکنش</h2>

<button class="secondary" onclick="goHome()">بازگشت</button>

</div>

<div class="card">

<form id="transactionForm">

<input type="hidden" id="transactionType">

<div class="form-grid">

<div>

<label>شماره رسید</label>

<input id="receipt" readonly>

</div>

<div>

<label>نام شخص</label>

<input id="customerName" required>

</div>

<div>

<label>مبلغ (AFN)</label>

<input id="amount" inputmode="numeric" required>

</div>

<div>

<label>تاریخ</label>

<input id="transactionDate" type="date" required>

</div>

<div>

<label>ساعت</label>

<input id="transactionTime" type="time" required>

</div>

<div>

<label>ثبت‌کننده</label>

<input id="registeredBy" readonly>

</div>

<div class="wide">

<label>توضیحات</label>

<textarea id="description" rows="3" required></textarea>

</div>

</div>

<button id="saveButton" class="primary full">ثبت تراکنش</button>

</form>

</div>

</main>

<!-- فهرست دریافت و برداشت -->

<main id="listPage">

<div class="page-head">

<h2 id="listTitle">فهرست تراکنش‌ها</h2>

<button class="secondary" onclick="goHome()">بازگشت</button>

</div>

<div class="table-wrap">

<table>

<thead><tr><th>رسید</th><th>نام</th><th>مبلغ</th><th>تاریخ</th><th>ساعت</th><th>چاپ</th></tr></thead>

<tbody id="listBody"></tbody>

</table>

</div>

</main>

<!-- تاریخچه -->

<main id="historyPage">

<div class="page-head">

<h2>تاریخچه تراکنش‌ها</h2>

<button class="secondary" onclick="goHome()">بازگشت</button>

</div>

<div class="tools">

<input class="wide" id="historySearch" placeholder="جستجوی نام یا شماره رسید">

<input id="historyFrom" type="date" aria-label="از تاریخ">

<input id="historyTo" type="date" aria-label="تا تاریخ">

</div>

<button class="primary full" onclick="printHistory()">چاپ گزارش</button>

<div class="table-wrap" style="margin-top:15px">

<table>

<thead><tr><th>رسید</th><th>نام</th><th>مبلغ</th><th>نوع</th><th>تاریخ</th><th>ثبت‌کننده</th><th>چاپ</th></tr></thead>

<tbody id="historyBody"></tbody>

</table>

</div>

</main>

</div>

<div id="printArea"></div>

<script>

"use strict";

/* تنظیمات اتصال؛ کلید عمومی پروژه */

const SUPABASE_URL="https://pxlvwdwznlklqdofbspv.supabase.co";

const SUPABASE_KEY="sb_publishable_5J-p7w5eYZTMsSGPYLtd9g_QiitckBc";

const supabaseClient=window.supabase.createClient(

  SUPABASE_URL,

  SUPABASE_KEY,

  {auth:{

    persistSession:true,

    autoRefreshToken:true,

    detectSessionInUrl:true,

    storage:window.localStorage

  }}

);

let currentUser=null;

let currentProfile=null;

let transactions=[];

let currentType="receive";

let isSaving=false;

const $=id=>document.getElementById(id);

function showError(message){

  $("loginError").textContent=message;

  $("loginError").classList.remove("hidden");

}

function clearError(){

  $("loginError").classList.add("hidden");

}

function showPage(id){

  document.querySelectorAll("main").forEach(p=>p.classList.remove("active"));

  $(id).classList.add("active");

}

function todayISO(){

  const d=new Date();

  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

}

function currentTime(){

  const d=new Date();

  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;

}

function number(value){

  return Number(value||0).toLocaleString("en-US");

}

function amountValue(value){

  return Number(String(value||"").replace(/[^\d]/g,""))||0;

}

function escapeHTML(value){

  return String(value??"").replace(/[&<>"']/g,c=>({

    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"

  })[c]);

}

function dbDate(value){

  return value?value.replaceAll("-","/"):"";

}

function isoDate(value){

  if(!value)return "";

  const s=String(value).slice(0,10);

  return s.includes("/")?s.replaceAll("/","-"):s;

}

function jalaliDate(value){

  if(!value)return "-";

  const d=new Date(isoDate(value)+"T12:00:00");

  if(Number.isNaN(d.getTime()))return "-";

  return new Intl.DateTimeFormat("fa-IR-u-ca-persian",{

    year:"numeric",month:"2-digit",day:"2-digit"

  }).format(d);

}

/* ورود */

$("loginForm").addEventListener("submit",async e=>{

  e.preventDefault();

  clearError();

  const email=$("loginEmail").value.trim();

  const password=$("loginPassword").value;

  const button=$("loginButton");

  button.disabled=true;

  button.textContent="در حال ورود...";

  try{

    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});

    if(error)throw error;

    currentUser=data.user;

    await loadProfile();

    await enterApp();

  }catch(error){

    console.error("Login:",error);

    showError("ورود انجام نشد: "+(error.message||"خطای نامشخص"));

  }finally{

    button.disabled=false;

    button.textContent="ورود";

  }

});

/* دریافت پروفایل */

async function loadProfile(){

  if(!currentUser)throw new Error("حساب کاربری پیدا نشد.");

  const {data,error}=await supabaseClient

    .from("profiles")

    .select("*")

    .eq("id",currentUser.id)

    .maybeSingle();

  if(error)throw error;

  if(!data)throw new Error("پروفایل این حساب در جدول profiles پیدا نشد.");

  currentProfile=data;

}

/* ورود به داشبورد */

async function enterApp(){

  $("loginPage").style.display="none";

  $("appContainer").style.display="block";

  $("userName").textContent=

    currentProfile?.full_name||currentProfile?.name||currentUser?.email||"کاربر";

  $("userRole").textContent=

    currentProfile?.role?" — "+currentProfile.role:"";

  try{

    await loadTransactions();

  }catch(error){

    console.error("Transactions:",error);

    alert("ورود موفق بود، اما دریافت تراکنش‌ها انجام نشد. اتصال اینترنت یا دسترسی دیتابیس را بررسی کنید.");

  }

  updateDashboard();

  showPage("homePage");

}

/* بازیابی نشست ورود */

async function checkExistingSession(){

  try{

    const {data,error}=await supabaseClient.auth.getSession();

    if(error)throw error;

    if(!data.session)return;

    currentUser=data.session.user;

    await loadProfile();

    await enterApp();

  }catch(error){

    console.error("Session:",error);

    showError("نشست ورود بررسی شد، اما اطلاعات حساب بارگذاری نشد. اینترنت را بررسی و صفحه را دوباره بارگذاری کنید.");

  }

}

/* خروج */

async function logout(){

  const {error}=await supabaseClient.auth.signOut();

  if(error){

    alert("خروج انجام نشد: "+error.message);

    return;

  }

  currentUser=null;

  currentProfile=null;

  transactions=[];

  $("appContainer").style.display="none";

  $("loginPage").style.display="flex";

  $("loginPassword").value="";

  clearError();

}

/* دریافت تراکنش‌ها */

async function loadTransactions(){

  const {data,error}=await supabaseClient

    .from("transaction")

    .select("*")

    .order("created_at",{ascending:false});

  if(error)throw error;

  transactions=data||[];

  updateDashboard();

}

/* محاسبه موجودی */

function updateDashboard(){

  let balance=0,receive=0,withdraw=0;

  const today=todayISO();

  transactions.forEach(t=>{

    const value=Number(t.amount)||0;

    if(t.type==="receive"){

      balance+=value;

      if(isoDate(t.date)===today)receive+=value;

    }else if(t.type==="withdraw"){

      balance-=value;

      if(isoDate(t.date)===today)withdraw+=value;

    }

  });

  $("balance").textContent=number(balance);

  $("todayReceive").textContent=number(receive)+" AFN";

  $("todayWithdraw").textContent=number(withdraw)+" AFN";

}

/* شماره رسید بعدی */

function nextReceipt(type){

  const prefix=type==="receive"?"TPH-D":"TPH-B";

  let max=0;

  transactions.forEach(t=>{

    if(t.type!==type)return;

    const match=String(t.receipt||"").match(new RegExp("^"+prefix+"(\\d+)$","i"));

    if(match)max=Math.max(max,Number(match[1]));

  });

  return prefix+(max+1);

}

/* باز کردن فرم */

function openTransaction(type){

  currentType=type;

  $("transactionForm").reset();

  $("transactionType").value=type;

  $("formTitle").textContent=type==="receive"?"ثبت دریافت":"ثبت برداشت";

  $("saveButton").textContent=type==="receive"?"ثبت دریافت":"ثبت برداشت";

  $("saveButton").className=type==="receive"?"primary full":"danger full";

  $("receipt").value=nextReceipt(type);

  $("transactionDate").value=todayISO();

  $("transactionTime").value=currentTime();

  $("registeredBy").value=currentProfile?.full_name||currentProfile?.name||currentUser?.email||"";

  showPage("transactionPage");

}

/* قالب مبلغ */

$("amount").addEventListener("input",e=>{

  const raw=e.target.value.replace(/[^\d]/g,"");

  e.target.value=raw?Number(raw).toLocaleString("en-US"):"";

});

/* ثبت تراکنش */

$("transactionForm").addEventListener("submit",async e=>{

  e.preventDefault();

  if(isSaving)return;

  const type=$("transactionType").value;

  const customerName=$("customerName").value.trim();

  const amount=amountValue($("amount").value);

  const description=$("description").value.trim();

  const date=$("transactionDate").value;

  const time=$("transactionTime").value;

  const registeredBy=$("registeredBy").value.trim();

  if(!customerName||!amount||!description||!date||!time){

    alert("تمام اطلاعات ضروری را درست وارد کنید.");

    return;

  }

  const button=$("saveButton");

  isSaving=true;

  button.disabled=true;

  button.textContent="در حال ثبت...";

  try{

    const data={

      type,

      currency:"AFN",

      amount,

      dascription:description,

      customer_name:customerName,

      rate:null,

      receipt:nextReceipt(type),

      date:dbDate(date),

      time,

      registered_by:registeredBy

    };

    const result=await supabaseClient

      .from("transaction")

      .insert([data])

      .select()

      .single();

    if(result.error)throw result.error;

    /* ثبت در دیتابیس موفق شده؛ خطای بارگذاری مجدد نباید ثبت دوباره ایجاد کند */

    if(result.data){

      transactions.unshift(result.data);

    }

    updateDashboard();

    try{

      await loadTransactions();

    }catch(refreshError){

      console.error("Refresh after insert:",refreshError);

      alert("تراکنش ثبت شد، اما به‌روزرسانی فهرست انجام نشد. لطفاً صفحه را دوباره بارگذاری کنید.");

    }

    showReceipt(result.data);

    $("transactionForm").reset();

    $("transactionType").value=type;

    $("receipt").value=nextReceipt(type);

    $("transactionDate").value=todayISO();

    $("transactionTime").value=currentTime();

    $("registeredBy").value=currentProfile?.full_name||currentProfile?.name||currentUser?.email||"";

  }catch(error){

    console.error("Save:",error);

    alert("ثبت تراکنش انجام نشد: "+(error.message||"خطای نامشخص"));

  }finally{

    isSaving=false;

    button.disabled=false;

    button.textContent=type==="receive"?"ثبت دریافت":"ثبت برداشت";

  }

});

/* نمایش فهرست دریافت یا برداشت */

async function openList(type){

  try{

    await loadTransactions();

  }catch(error){

    alert("دریافت اطلاعات انجام نشد: "+error.message);

    return;

  }

  currentType=type;

  $("listTitle").textContent=type==="receive"?"فهرست دریافت‌ها":"فهرست برداشت‌ها";

  const list=transactions.filter(t=>t.type===type);

  $("listBody").innerHTML=list.length?list.map(t=>`

    <tr>

      <td>${escapeHTML(t.receipt||"-")}</td>

      <td>${escapeHTML(t.customer_name||"-")}</td>

      <td>${number(t.amount)} AFN</td>

      <td>${escapeHTML(jalaliDate(t.date))}</td>

      <td>${escapeHTML(t.time||"-")}</td>

      <td><button class="secondary" onclick="printReceipt('${escapeHTML(t.id)}')">چاپ</button></td>

    </tr>

  `).join(""):`<tr><td colspan="6">اطلاعاتی ثبت نشده است.</td></tr>`;

  showPage("listPage");

}

/* تاریخچه */

async function openHistory(){

  try{

    await loadTransactions();

  }catch(error){

    alert("دریافت تاریخچه انجام نشد: "+error.message);

    return;

  }

  $("historySearch").value="";

  $("historyFrom").value="";

  $("historyTo").value="";

  renderHistory();

  showPage("historyPage");

}

function filteredTransactions(){

  const search=$("historySearch").value.trim().toLowerCase();

  const from=$("historyFrom").value;

  const to=$("historyTo").value;

  return transactions.filter(t=>{

    const date=isoDate(t.date);

    const text=(String(t.receipt||"")+" "+String(t.customer_name||"")).toLowerCase();

    return (!search||text.includes(search))&&

      (!from||date>=from)&&

      (!to||date<=to);

  });

}

function renderHistory(){

  const list=filteredTransactions();

  $("historyBody").innerHTML=list.length?list.map(t=>`

    <tr>

      <td>${escapeHTML(t.receipt||"-")}</td>

      <td>${escapeHTML(t.customer_name||"-")}</td>

      <td>${number(t.amount)} AFN</td>

      <td class="${t.type==="receive"?"receive":"withdraw"}">${t.type==="receive"?"دریافت":"برداشت"}</td>

      <td>${escapeHTML(jalaliDate(t.date))}</td>

      <td>${escapeHTML(t.registered_by||"-")}</td>

      <td><button class="secondary" onclick="printReceipt('${escapeHTML(t.id)}')">چاپ</button></td>

    </tr>

  `).join(""):`<tr><td colspan="7">تراکنشی پیدا نشد.</td></tr>`;

}

$("historySearch").addEventListener("input",renderHistory);

$("historyFrom").addEventListener("change",renderHistory);

$("historyTo").addEventListener("change",renderHistory);

/* ساخت رسید */

function receiptHTML(t){

  const receive=t.type==="receive";

  return `

  <div class="receipt">

    <div class="receipt-head">

      <div><h2>شرکت همدرد</h2><small>سیستم حسابداری</small></div>

      <div><strong>شماره رسید</strong><br>${escapeHTML(t.receipt||"-")}</div>

    </div>

    <table>

      <tr><td>نوع تراکنش</td><td>${receive?"دریافت":"برداشت"}</td></tr>

      <tr><td>نام شخص</td><td>${escapeHTML(t.customer_name||"-")}</td></tr>

      <tr><td>توضیحات</td><td>${escapeHTML(t.dascription||"-")}</td></tr>

      <tr><td>تاریخ</td><td>${escapeHTML(jalaliDate(t.date))}</td></tr>

      <tr><td>ساعت</td><td>${escapeHTML(t.time||"-")}</td></tr>

      <tr><td>ثبت‌کننده</td><td>${escapeHTML(t.registered_by||"-")}</td></tr>

      <tr><td>مبلغ</td><td class="amount">${number(t.amount)} AFN</td></tr>

    </table>

    <div class="receipt-foot">

      <div>امضای مشتری</div>

      <div>مهر و امضای شرکت</div>

    </div>

  </div>`;

}

function showReceipt(t){

  $("printArea").innerHTML=receiptHTML(t);

  window.print();

}

function printReceipt(id){

  const t=transactions.find(x=>String(x.id)===String(id));

  if(!t){

    alert("رسید پیدا نشد.");

    return;

  }

  const w=window.open("","_blank","width=850,height=950");

  if(!w){

    alert("اجازه باز شدن پنجره چاپ را فعال کنید.");

    return;

  }

  w.document.open();

  w.document.write(`<!DOCTYPE html><html lang="fa" dir="rtl"><head>

  <meta charset="UTF-8"><title>رسید همدرد</title>

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>body{font-family:Vazirmatn,Tahoma;padding:20px}.receipt{max-width:650px;margin:auto;padding:25px;border:1px solid #ddd}.receipt-head{display:flex;justify-content:space-between;border-bottom:2px solid #1f2f25;padding-bottom:15px}.receipt table{width:100%;border-collapse:collapse;margin-top:20px}.receipt td{padding:13px;border-bottom:1px solid #ddd}.receipt td:first-child{font-weight:bold;color:#666;width:35%}.amount{font-size:22px;font-weight:bold}.receipt-foot{display:flex;justify-content:space-between;margin-top:60px}.receipt-foot div{width:45%;text-align:center;border-top:1px solid;padding-top:10px}@page{size:A4;margin:15mm}</style>

  </head><body>${receiptHTML(t)}<script>window.onload=()=>{window.print();};<\/script></body></html>`);

  w.document.close();

}

/* چاپ گزارش تاریخچه */

function printHistory(){

  const list=filteredTransactions();

  if(!list.length){

    alert("تراکنشی برای چاپ وجود ندارد.");

    return;

  }

  const rows=list.map((t,i)=>`

    <tr>

      <td>${i+1}</td>

      <td>${escapeHTML(t.receipt||"-")}</td>

      <td>${escapeHTML(t.customer_name||"-")}</td>

      <td>${escapeHTML(jalaliDate(t.date))}</td>

      <td>${number(t.amount)} AFN</td>

      <td>${t.type==="receive"?"دریافت":"برداشت"}</td>

      <td>${escapeHTML(t.dascription||"-")}</td>

      <td>${escapeHTML(t.registered_by||"-")}</td>

    </tr>`).join("");

  const w=window.open("","_blank");

  if(!w){

    alert("اجازه باز شدن پنجره چاپ را فعال کنید.");

    return;

  }

  w.document.write(`<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><title>گزارش همدرد</title>

  <style>body{font-family:Tahoma;padding:20px}h2{text-align:center}table{width:100%;border-collapse:collapse}th,td{border:1px solid #aaa;padding:8px;text-align:center;font-size:12px}th{background:#eee}@page{size:A4 landscape}</style>

  </head><body><h2>گزارش تاریخچه تراکنش‌های شرکت همدرد</h2><table><thead><tr><th>ردیف</th><th>رسید</th><th>نام</th><th>تاریخ</th><th>مبلغ</th><th>نوع</th><th>توضیحات</th><th>ثبت‌کننده</th></tr></thead><tbody>${rows}</tbody></table><script>window.onload=()=>window.print();<\/script></body></html>`);

  w.document.close();

}

/* بازیابی رمز */

$("forgotButton").addEventListener("click",()=>{

  $("loginForm").classList.add("hidden");

  $("forgotButton").classList.add("hidden");

  $("loginError").classList.add("hidden");

  $("recoveryBox").classList.remove("hidden");

  $("recoveryEmail").value=$("loginEmail").value.trim();

});

$("backLogin").addEventListener("click",()=>{

  $("recoveryBox").classList.add("hidden");

  $("loginForm").classList.remove("hidden");

  $("forgotButton").classList.remove("hidden");

  $("recoveryMessage").textContent="";

  $("newPassword").value="";

  $("confirmPassword").value="";

  history.replaceState({},document.title,location.pathname+location.search);

});

$("sendRecovery").addEventListener("click",async()=>{

  const email=$("recoveryEmail").value.trim();

  if(!email){

    $("recoveryMessage").textContent="ایمیل را وارد کنید.";

    return;

  }

  const button=$("sendRecovery");

  button.disabled=true;

  try{

    const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{

      redirectTo:location.origin+location.pathname

    });

    if(error)throw error;

    $("recoveryMessage").textContent="لینک بازیابی ارسال شد. صندوق ورودی و پوشه Spam را بررسی کنید.";

  }catch(error){

    console.error(error);

    $("recoveryMessage").textContent="ارسال لینک انجام نشد. تنظیمات ایمیل و اینترنت را بررسی کنید.";

  }finally{

    button.disabled=false;

  }

});

$("savePassword").addEventListener("click",async()=>{

  const password=$("newPassword").value;

  const confirm=$("confirmPassword").value;

  if(password.length<8){

    $("recoveryMessage").textContent="رمز جدید باید حداقل ۸ کاراکتر باشد.";

    return;

  }

  if(password!==confirm){

    $("recoveryMessage").textContent="رمزها یکسان نیستند.";

    return;

  }

  const button=$("savePassword");

  button.disabled=true;

  try{

    const {error}=await supabaseClient.auth.updateUser({password});

    if(error)throw error;

    $("recoveryMessage").textContent="رمز عبور تغییر کرد. اکنون می‌توانید وارد شوید.";

    await supabaseClient.auth.signOut();

    $("backLogin").click();

  }catch(error){

    console.error(error);

    $("recoveryMessage").textContent="تغییر رمز انجام نشد. ممکن است لینک منقضی شده باشد.";

  }finally{

    button.disabled=false;

  }

});

/* تشخیص لینک بازیابی */

function isRecoveryLink(){

  const hash=new URLSearchParams(location.hash.replace(/^#/,""));

  const query=new URLSearchParams(location.search);

  return hash.get("type")==="recovery"||query.get("type")==="recovery"||query.has("code");

}

function showRecoveryMode(){

  $("loginForm").classList.add("hidden");

  $("forgotButton").classList.add("hidden");

  $("recoveryBox").classList.remove("hidden");

  $("recoveryTitle").textContent="تعیین رمز عبور جدید";

  $("recoveryEmailBox").classList.add("hidden");

  $("newPasswordBox").classList.remove("hidden");

}

supabaseClient.auth.onAuthStateChange(event=>{

  if(event==="PASSWORD_RECOVERY"){

    showRecoveryMode();

  }

});

document.addEventListener("DOMContentLoaded",()=>{

  if(isRecoveryLink()){

    showRecoveryMode();

  }else{

    checkExistingSession();

  }

});

</script>
