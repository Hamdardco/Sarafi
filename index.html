<script>
"use strict";


const SUPABASE_URL =
"https://pxlvwdwznlklqdofbspv.supabase.co";


const SUPABASE_KEY =
"sb_publishable_5J-p7w5eYZTMsSGPYLtd9g_QiitckBc";


const TABLE_NAME =
"transaction";


/* لوگوی داخلی - بدون فایل خارجی و بدون Base64 خراب */

const LOGO_DATA =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">

<rect
width="300"
height="300"
rx="55"
fill="#1f2f25"
/>

<circle
cx="150"
cy="150"
r="105"
fill="none"
stroke="#c9a85c"
stroke-width="7"
/>

<text
x="150"
y="135"
text-anchor="middle"
fill="#c9a85c"
font-size="58"
font-family="Tahoma, Arial"
font-weight="bold"
>
همدرد
</text>

<text
x="150"
y="185"
text-anchor="middle"
fill="white"
font-size="25"
font-family="Arial"
>
HAMDARD
</text>

</svg>
`);


let supabaseClient=null;
let currentUser=null;
let currentProfile=null;
let transactions=[];
let receiveReceiptNumber=1;
let withdrawReceiptNumber=1;


try{

supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

}catch(error){

console.error(error);

}


/* ---------------- خطاها ---------------- */

function showError(message){

const box =
document.getElementById("errorBox");

box.style.display="block";
box.innerText=message;

}


function hideError(){

document.getElementById("errorBox")
.style.display="none";

}


function showLoginError(message){

const box =
document.getElementById("loginError");

box.style.display="block";
box.innerText=message;

}


function hideLoginError(){

document.getElementById("loginError")
.style.display="none";

}


/* ---------------- ورود ---------------- */

async function login(){

hideLoginError();

const email =
document.getElementById("loginEmail")
.value
.trim();

const password =
document.getElementById("loginPassword")
.value;

const button =
document.getElementById("loginButton");


if(!email){

showLoginError(
"لطفاً ایمیل را وارد کنید."
);

return;

}


if(!password){

showLoginError(
"لطفاً رمز عبور را وارد کنید."
);

return;

}


button.disabled=true;
button.innerText="در حال ورود...";


try{

const result =
await supabaseClient.auth.signInWithPassword({

email:email,
password:password

});


if(result.error)
throw result.error;


currentUser =
result.data.user;


await loadProfile();


}catch(error){

console.error(error);

showLoginError(
"ورود انجام نشد: "+
error.message
);

}finally{

button.disabled=false;
button.innerText="ورود";

}

}


/* ---------------- پروفایل ---------------- */

async function loadProfile(){

if(!currentUser)
return;


const result =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.single();


if(result.error){

console.error(result.error);

await supabaseClient.auth.signOut();

currentUser=null;
currentProfile=null;

showLoginError(
"برای این حساب پروفایل ثبت نشده است."
);

return;

}


currentProfile =
result.data;


await enterApp();

}


/* ---------------- ورود به برنامه ---------------- */

async function enterApp(){

try{

document.getElementById("loginPage")
.style.display="none";

document.getElementById("appContainer")
.style.display="block";


document.getElementById("mainLogo")
.src=LOGO_DATA;


document.getElementById("userInfo")
.innerText =
"کاربر: "+
(currentProfile.full_name||"کاربر")+
" | نقش: "+
(currentProfile.role||"cashier");


updateTodayDate();

prepareNewTransaction("receive");

prepareNewTransaction("withdraw");

await loadTransactions();

}catch(error){

console.error(error);

document.getElementById("appContainer")
.style.display="none";

document.getElementById("loginPage")
.style.display="flex";

showLoginError(
"خطا در باز کردن سیستم: "+
error.message
);

}

}


/* ---------------- خروج ---------------- */

async function logout(){

await supabaseClient.auth.signOut();

currentUser=null;
currentProfile=null;
transactions=[];

document.getElementById("appContainer")
.style.display="none";

document.getElementById("loginPage")
.style.display="flex";

document.getElementById("loginEmail").value="";
document.getElementById("loginPassword").value="";

}


/* ---------------- سشن قبلی ---------------- */

async function checkExistingSession(){

try{

const result =
await supabaseClient.auth.getSession();


if(result.error){

console.error(result.error);
return;

}


if(!result.data.session)
return;


currentUser =
result.data.session.user;


await loadProfile();


}catch(error){

console.error(error);

}

}


/* ---------------- تاریخ و ساعت ---------------- */

function pad2(number){

return String(number).padStart(2,"0");

}


function getTime(){

const now=new Date();

return (
pad2(now.getHours())+
":"+
pad2(now.getMinutes())
);

}


function getDateInfo(){

const now=new Date();

const gy=now.getFullYear();
const gm=now.getMonth()+1;
const gd=now.getDate();

const jalali =
gregorianToJalali(
gy,
gm,
gd
);


return{

gregorian:
gy+"/"+pad2(gm)+"/"+pad2(gd),

jalali:
jalali[0]+
"/"+
pad2(jalali[1])+
"/"+
pad2(jalali[2]),

combined:
gy+
"/"+
pad2(gm)+
"/"+
pad2(gd)+
" | "+
jalali[0]+
"/"+
pad2(jalali[1])+
"/"+
pad2(jalali[2]),

key:
gy+
"-"+
pad2(gm)+
"-"+
pad2(gd)

};

}


function updateTodayDate(){

const info=getDateInfo();

document.getElementById("todayDate")
.innerText=
"امروز: "+
info.combined;

}


/* ---------------- تبدیل تاریخ ---------------- */

function gregorianToJalali(gy,gm,gd){

const gdm=[
0,31,59,90,120,151,
181,212,243,273,304,334
];

const gy2 =
gm>2
?gy+1
:gy;


let days =
355666+
365*gy+
Math.floor((gy2+3)/4)-
Math.floor((gy2+99)/100)+
Math.floor((gy2+399)/400)+
gd+
gdm[gm-1];


let jy =
-1595+
33*Math.floor(days/12053);


days%=12053;


jy +=
4*Math.floor(days/1461);


days%=1461;


if(days>365){

jy +=
Math.floor((days-1)/365);

days =
(days-1)%365;

}


let jm;


if(days<186){

jm =
1+
Math.floor(days/31);

}else{

jm =
7+
Math.floor((days-186)/30);

}


const jd =
1+
(
days<186
?days%31
:(days-186)%30
);


return[
jy,
jm,
jd
];

}


/* ---------------- مبلغ ---------------- */

function formatAmount(amount){

return(
Number(amount)||0
).toLocaleString("en-US")
);

}


function formatMoneyInput(input){

let value =
input.value.replace(/\D/g,"");


if(!value){

input.value="";
return;

}


input.value =
Number(value)
.toLocaleString("en-US");

}


/* ---------------- امنیت نمایش متن ---------------- */

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ---------------- خواندن تراکنش‌ها ---------------- */

async function loadTransactions(){

hideError();

try{

const result =
await supabaseClient
.from(TABLE_NAME)
.select("*")
.order("id",{ascending:false});


if(result.error)
throw result.error;


transactions =
(result.data||[])
.map(function(t){

let dateKey="";


if(t.date){

dateKey =
String(t.date)
.substring(0,10)
.replace(/\//g,"-");

}


return{

id:t.id,

type:t.type,

currency:t.currency||"AFN",

amount:
Number(t.amount)||0,

description:
t.dascription||"",

person:
t.customer_name||"",

createdAt:
t.created_at||"",

rate:
t.rate||1,

receipt:
t.receipt||"",

date:
t.date||"",

time:
t.time||"",

registeredBy:
t.registered_by||"",

dateKey:dateKey

};

});


updateReceiptNumbers();

updateBalance();

updateTodaySummary();

renderTransactions("receive");

renderTransactions("withdraw");

renderAllHistory();


}catch(error){

console.error(error);

showError(
"خطا در خواندن اطلاعات از Supabase:\n"+
error.message
);

}

}


/* ---------------- شماره رسید ---------------- */

function updateReceiptNumbers(){

let maxReceive=0;
let maxWithdraw=0;


transactions.forEach(function(t){

const receipt =
String(t.receipt||"");


if(t.type==="receive"){

const match =
receipt.match(/^TPH_D(\d+)$/);


if(match){

maxReceive =
Math.max(
maxReceive,
Number(match[1])
);

}

}


if(t.type==="withdraw"){

const match =
receipt.match(/^TPH_B(\d+)$/);


if(match){

maxWithdraw =
Math.max(
maxWithdraw,
Number(match[1])
);

}

}

});


receiveReceiptNumber =
maxReceive+1;


withdrawReceiptNumber =
maxWithdraw+1;

}

/* ---------------- پاک کردن فرم ---------------- */

function clearForm(type){

if(type==="receive"){

document.getElementById("receivePerson")
.value="";

.value="";

document.getElementById("receiveDescription")
.value="";

prepareNewTransaction("receive");

}else{

.value="";

.value="";

.value="";

/* ---------------- موجودی ---------------- */

function updateBalance(){

let balance=0;


transactions.forEach(function(t){

if(t.type==="receive"){

balance +=
Number(t.amount);

}


if(t.type==="withdraw"){

balance -=
Number(t.amount);

}

});


document.getElementById("balance")
.innerText =
formatAmount(balance);

}


/* ---------------- خلاصه امروز ---------------- */

function updateTodaySummary(){

const today =
getDateInfo().key;


let receive=0;
let withdraw=0;


transactions.forEach(function(t){

if(t.dateKey!==today)
return;


if(t.type==="receive"){

receive +=
Number(t.amount);

}


if(t.type==="withdraw"){

withdraw +=
Number(t.amount);

}

});


document.getElementById("todayReceive")
.innerText =
formatAmount(receive)+
" AFN";


document.getElementById("todayWithdraw")
.innerText =
formatAmount(withdraw)+
" AFN";

}


/* ---------------- لیست دریافت / برداشت ---------------- */

function renderTransactions(type){

const list =
document.getElementById(
type==="receive"
?"receiveList"
:"withdrawList"
);


const search =
document.getElementById(
type==="receive"
?"receiveSearch"
:"withdrawSearch"
)
.value
.trim()
.toLowerCase();


const filtered =
transactions.filter(function(t){

if(t.type!==type)
return false;


if(!search)
return true;


return(
String(t.receipt)
.toLowerCase()
.includes(search)
||
String(t.person)
.toLowerCase()
.includes(search)
);

});


if(!filtered.length){

list.innerHTML =
'<div class="empty">تراکنشی وجود ندارد.</div>';

return;

}


list.innerHTML =
filtered
.map(createTransactionElement)
.join("");

}


/* ---------------- تاریخچه کامل ---------------- */

function getFilteredHistory(){

const search =
document.getElementById("allSearch")
.value
.trim()
.toLowerCase();


const fromDate =
document.getElementById("historyFromDate")
.value;


const toDate =
document.getElementById("historyToDate")
.value;


const typeFilter =
document.getElementById("historyType")
.value;


return transactions.filter(function(t){

if(typeFilter!=="all"){

if(t.type!==typeFilter)
return false;

}


if(search){

const matchSearch =
String(t.receipt)
.toLowerCase()
.includes(search)
||
String(t.person)
.toLowerCase()
.includes(search);


if(!matchSearch)
return false;

}


if(fromDate){

if(!t.dateKey)
return false;


if(t.dateKey<fromDate)
return false;

}


if(toDate){

if(!t.dateKey)
return false;


if(t.dateKey>toDate)
return false;

}


return true;

});

}
