<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://pxlvwdwznlklqdofbspv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_5J-p7w5eYZTMsSGPYLtd9g_QiitckBc";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let currentTransactionType = "receive";
let transactions = [];


/* =========================
   ENGLISH DIGITS
========================= */

function englishDigits(value){

  if(value === null || value === undefined)
    return "";

  return String(value)
    .replace(/[۰-۹]/g, d =>
      "۰۱۲۳۴۵۶۷۸۹".indexOf(d)
    )
    .replace(/[٠-٩]/g, d =>
      "٠١٢٣٤٥٦٧٨٩".indexOf(d)
    );
}


/* =========================
   DATE
========================= */

function pad(n){
  return String(n).padStart(2,"0");
}


function todayISO(){

  const now = new Date();

  return now.getFullYear() +
    "-" +
    pad(now.getMonth()+1) +
    "-" +
    pad(now.getDate());
}


function currentTime(){

  const now = new Date();

  return pad(now.getHours()) +
    ":" +
    pad(now.getMinutes());
}


/* =========================
   GREGORIAN -> JALALI
========================= */

function gregorianToJalali(gy,gm,gd){

  const g_d_m=[
    0,31,59,90,120,151,
    181,212,243,273,304,334
  ];

  let jy;

  if(gy > 1600){
    jy=979;
    gy-=1600;
  }else{
    jy=0;
    gy-=621;
  }

  let gy2=(gm>2)?(gy+1):gy;

  let days=
    (365*gy)+
    Math.floor((gy2+3)/4)-
    Math.floor((gy2+99)/100)+
    Math.floor((gy2+399)/400)-
    80+
    gd+
    g_d_m[gm-1];

  jy += 33*Math.floor(days/12053);
  days %= 12053;

  jy += 4*Math.floor(days/1461);
  days %= 1461;

  if(days>365){
    jy += Math.floor((days-1)/365);
    days=(days-1)%365;
  }

  let jm;
  let jd;

  if(days<186){
    jm=1+Math.floor(days/31);
    jd=1+(days%31);
  }else{
    jm=7+Math.floor((days-186)/30);
    jd=1+((days-186)%30);
  }

  return [
    jy,
    jm,
    jd
  ];
}


function jalaliFromISO(iso){

  if(!iso)
    return "";

  const clean=String(iso).substring(0,10);

  const parts=clean.split("-");

  if(parts.length!==3)
    return "";

  const gy=Number(parts[0]);
  const gm=Number(parts[1]);
  const gd=Number(parts[2]);

  const j=gregorianToJalali(
    gy,
    gm,
    gd
  );

  return englishDigits(
    j[0] + "/" +
    pad(j[1]) + "/" +
    pad(j[2])
  );
}


function gregorianDisplay(iso){

  if(!iso)
    return "";

  const p=String(iso)
    .substring(0,10)
    .split("-");

  if(p.length!==3)
    return "";

  return englishDigits(
    p[0] + "/" +
    p[1] + "/" +
    p[2]
  );
}


function homeDate(){

  const iso=todayISO();

  const shamsi=jalaliFromISO(iso);
  const miladi=gregorianDisplay(iso);

  return shamsi +
    " | " +
    miladi;
}


/* =========================
   DATABASE DATE
========================= */

function dateToDB(date){

  if(!date)
    return "";

  return date.replaceAll("-","/");
}


function dbDateToISO(date){

  if(!date)
    return "";

  const s=String(date)
    .substring(0,10)
    .replaceAll("/","-");

  return s;
}


/* =========================
   LOAD TRANSACTIONS
========================= */

async function loadTransactions(){

  const {
    data,
    error
  } = await supabaseClient
    .from("transaction")
    .select("*")
    .order("created_at",{ascending:true});

  if(error){

    console.error(error);

    transactions=[];

    return;
  }

  transactions=data || [];

  updateHome();
}


/* =========================
   LOGIN
========================= */

async function login(){

  const username=
    document.getElementById("loginUsername")
      .value
      .trim();

  const password=
    document.getElementById("loginPassword")
      .value
      .trim();

  const msg=
    document.getElementById("loginMessage");

  msg.className="message";

  if(!username || !password){

    msg.textContent=
      "نام کاربری و رمز عبور را وارد کنید.";

    msg.classList.add("error");

    return;
  }


  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("username",username)
    .eq("password",password)
    .maybeSingle();


  if(error){

    console.error(error);

    msg.textContent=
      "خطا در اتصال به سیستم.";

    msg.classList.add("error");

    return;
  }


  if(!data){

    msg.textContent=
      "نام کاربری یا رمز عبور اشتباه است.";

    msg.classList.add("error");

    return;
  }


  currentUser=data;


  document.getElementById("loginPage")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");


  document.getElementById("welcomeName")
    .textContent=
      data.full_name ||
      data.username ||
      "کاربر";


  document.getElementById("welcomeRole")
    .textContent=
      data.role==="manager"
      ? "مدیر"
      : "صندوقدار";


  document.getElementById("homeDate")
    .textContent=
      homeDate();


  document.getElementById("logoutButton")
    .style.display="block";

/* =========================
   RECEIPT NUMBER
========================= */

function getNextReceiptNumber(type){

  const prefix=
    type==="receive"
    ? "TPH-D"
    : "TPH-B";


  let max=0;


  transactions.forEach(t=>{

    if(t.type!==type)
      return;


    const receipt=
      String(t.receipt || "")
        .trim();


    const regex=
      new RegExp(
        "^" +
        prefix.replace("-","\\-") +
        "(\\d+)$",
        "i"
      );


    const match=
      receipt.match(regex);


    if(match){

      max=
        Math.max(
          max,
          Number(match[1])
        );
    }

  });


  return prefix+(max+1);
}


/* =========================
   SAVE TRANSACTION
========================= */

async function saveTransaction(){

  const name=
    document.getElementById("customerName")
      .value
      .trim();


  const amount=
    Number(
      document.getElementById("amount")
        .value
    );


  const date=
    document.getElementById("transactionDate")
      .value;


  const time=
    document.getElementById("transactionTime")
      .value;


  const description=
    document.getElementById("description")
      .value
      .trim();


  const receipt=
    document.getElementById("receiptNumber")
      .value;


  const msg=
    document.getElementById("transactionMessage");


  msg.className="message";


  if(!name){

    msg.textContent="نام را وارد کنید.";

    msg.classList.add("error");

    return;
  }


  if(!amount || amount<=0){

    msg.textContent="مبلغ را وارد کنید.";

    msg.classList.add("error");

    return;
  }


  if(!date || !time){

    msg.textContent=
      "تاریخ و ساعت مشخص نیست.";

    msg.classList.add("error");

    return;
  }


  const row={

    type:currentTransactionType,

    currency:"AFN",

    amount:amount,

    dascription:description,

    customer_name:name,

    rate:1,

    receipt:receipt,

    date:dateToDB(date),

    time:time,

    registered_by:
      currentUser?.full_name ||
      currentUser?.username ||
      "کاربر"

  };


  const {
    data,
    error
  } = await supabaseClient
    .from("transaction")
    .insert([row])
    .select()
    .single();


  if(error){

    console.error(error);

    msg.textContent=
      "ثبت انجام نشد. اتصال یا اطلاعات دیتابیس را بررسی کنید.";

    msg.classList.add("error");

    return;
  }


  transactions.push(data);


  msg.textContent=
    "تراکنش با موفقیت ثبت شد.";

  msg.classList.add("success");


  /*
    بعد از ذخیره هم تاریخ و ساعت
    دوباره خودکار پر می‌شوند.
  */

  document.getElementById("transactionDate")
    .value=todayISO();

  document.getElementById("transactionTime")
    .value=currentTime();


  document.getElementById("receiptNumber")
    .value=
      getNextReceiptNumber(
        currentTransactionType
      );


  updateHome();


  setTimeout(()=>{

    showReceipt(data);

  },300);
}


/* =========================
   UPDATE HOME
========================= */

function updateHome(){

  let balance=0;
  let todayReceive=0;
  let todayWithdraw=0;

  const today=todayISO();


  transactions.forEach(t=>{

    const amount=
      Number(t.amount)||0;


    if(t.type==="receive"){

      balance += amount;

      if(
        dbDateToISO(t.date)===today
      ){
        todayReceive += amount;
      }

    }


    if(t.type==="withdraw"){

      balance -= amount;

      if(
        dbDateToISO(t.date)===today
      ){
        todayWithdraw += amount;
      }

    }

  });


  document.getElementById("balance")
    .textContent=
      englishDigits(
        balance.toLocaleString("en-US")
      );


  document.getElementById("todayReceive")
    .textContent=
      englishDigits(
        todayReceive.toLocaleString("en-US")
      );


  document.getElementById("todayWithdraw")
    .textContent=
      englishDigits(
        todayWithdraw.toLocaleString("en-US")
      );


  document.getElementById("homeDate")
    .textContent=
      homeDate();
}


/* =========================
   HISTORY
========================= */

function openHistory(){

  showPage("history");

}


function renderHistory(){

  const body=
    document.getElementById("historyBody");


  const search=
    document.getElementById("historySearch")
      .value
      .trim()
      .toLowerCase();


  const from=
    document.getElementById("fromDate")
      .value;


  const to=
    document.getElementById("toDate")
      .value;


  let list=[
    ...transactions
  ];


  list=list.filter(t=>{

    const receipt=
      String(t.receipt||"")
        .toLowerCase();


    const name=
      String(t.customer_name||"")
        .toLowerCase();


    if(search){

      if(
        !receipt.includes(search) &&
        !name.includes(search)
      ){
        return false;
      }

    }


    const d=
      dbDateToISO(t.date);


    if(from && d<from)
      return false;


    if(to && d>to)
      return false;


    return true;

  });


  list.sort(
    (a,b)=>
      new Date(
        (b.created_at||"")
      ) -
      new Date(
        (a.created_at||"")
      )
  );


  body.innerHTML="";


  if(!list.length){

    body.innerHTML=
      `<tr>
        <td colspan="9" class="empty">
          تراکنشی پیدا نشد
        </td>
      </tr>`;

    return;
  }


  list.forEach(t=>{

    const tr=
      document.createElement("tr");


    const typeText=
      t.type==="receive"
      ? "دریافت"
      : "برداشت";


    const typeClass=
      t.type==="receive"
      ? "type-receive"
      : "type-withdraw";


    tr.innerHTML=`

      <td>
        ${escapeHTML(t.receipt||"")}
      </td>

      <td>
        ${escapeHTML(t.customer_name||"")}
      </td>

      <td dir="ltr">
        ${englishDigits(t.time||"")}
      </td>

      <td dir="ltr">
        ${jalaliFromISO(
          dbDateToISO(t.date)
        )}
      </td>

      <td dir="ltr">
        ${englishDigits(
          Number(t.amount||0)
            .toLocaleString("en-US")
        )}
      </td>

      <td class="${typeClass}">
        ${typeText}
      </td>

      <td>
        ${escapeHTML(t.dascription||"")}
      </td>

      <td>
        ${escapeHTML(t.registered_by||"")}
      </td>

      <td class="no-print">
        <button
          class="print-btn"
          onclick="printReceiptById('${t.id}')">
          چاپ
        </button>
      </td>

    `;


    body.appendChild(tr);

  });

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
